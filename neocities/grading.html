<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✍️ 班級作業批改與成績登記</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --orange: #f97316;
      --orange-bg: rgba(249, 115, 22, 0.15);
      --green: #10b981;
      --blue: #38bdf8;
      --gold: #facc15;
      --gray-dot: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部整合單列 */
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      height: 48px;
      z-index: 50;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
    }

    .subject-select {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .assign-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .assign-meta-pill b {
      color: #facc15;
    }

    .header-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .header-btn:hover, .header-btn:active {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* 統一通用頂部導航按鈕樣式 */
    .header-nav-btn {
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-sizing: border-box;
      letter-spacing: 1px;
    }
    .nav-btn-scan {
      background: rgba(2, 132, 199, 0.12);
      color: #38bdf8;
      border: 1px solid #0284c7;
    }
    .nav-btn-scan:hover, .nav-btn-scan:active {
      background: #0284c7;
      color: #ffffff;
    }
    .nav-btn-check {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .nav-btn-check:hover, .nav-btn-check:active {
      background: #10b981;
      color: #ffffff;
    }
    .nav-btn-check.active {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .nav-btn-cor {
      background: rgba(249, 115, 22, 0.12);
      color: #fb923c;
      border: 1px solid #f97316;
    }
    .nav-btn-cor:hover, .nav-btn-cor:active {
      background: #f97316;
      color: #ffffff;
    }
    .nav-btn-cor.active {
      background: #f97316;
      color: #ffffff;
      border-color: #f97316;
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.4);
    }
    .nav-btn-grade {
      background: rgba(168, 85, 247, 0.12);
      color: #c084fc;
      border: 1px solid #a855f7;
    }
    .nav-btn-grade:hover, .nav-btn-grade:active {
      background: #a855f7;
      color: #ffffff;
    }
    .nav-btn-grade.active {
      background: #a855f7;
      color: #ffffff;
      border-color: #a855f7;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    }
    .nav-btn-pair {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .nav-btn-pair:hover, .nav-btn-pair:active {
      background: #334155;
      color: #ffffff;
      border-color: #64748b;
    }
    .nav-btn-reload {
      background: rgba(250, 204, 21, 0.12);
      color: #facc15;
      border: 1px solid #facc15;
    }
    .nav-btn-reload:hover, .nav-btn-reload:active {
      background: #facc15;
      color: #0f172a;
    }
    .nav-btn-sticker {
      background: rgba(13, 148, 136, 0.12);
      color: #2dd4bf;
      border: 1px solid #0d9488;
    }
    .nav-btn-sticker:hover, .nav-btn-sticker:active {
      background: #0d9488;
      color: #ffffff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* 主工作區 (橫向佈局：左側座號矩陣，右側評分控制台) */
    .main-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 48px);
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* 📋 左側：30 座號矩陣區 (可上下滾動) */
    .seat-grid-container {
      flex: 1.25;
      padding: 6px 8px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 58px;
      gap: 6px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      border-right: 1px solid #1e293b;
      touch-action: pan-y;
    }

    /* 自訂美化捲軸 */
    .seat-grid-container::-webkit-scrollbar {
      width: 5px;
    }
    .seat-grid-container::-webkit-scrollbar-track {
      background: #090d16;
    }
    .seat-grid-container::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .seat-grid-container::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .seat-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 6px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
      min-height: 56px;
      box-sizing: border-box;
    }

    .seat-card:active {
      transform: scale(0.96);
    }

    /* 批改狀態外框 (已給分：亮紫燈號) */
    .seat-card.graded {
      border: 2px solid #c084fc !important; /* 亮紫色：已給分燈號 */
      background: rgba(168, 85, 247, 0.16) !important;
      box-shadow: 0 0 8px rgba(192, 132, 252, 0.4) !important;
    }
    .seat-card.graded .seat-num {
      color: #e9d5ff !important;
    }
    .seat-card.graded .seat-score {
      color: #c084fc !important;
      font-weight: 900 !important;
    }
    .seat-card.ungraded {
      border: 1px solid #334155; /* 暗灰黑框：未批改 */
    }
    .seat-card.selected {
      border: 2px solid #facc15 !important; /* 亮黃框：當前選中 */
      background: rgba(250, 204, 21, 0.18) !important;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.5) !important;
    }
    .seat-card.selected .seat-num {
      color: #facc15 !important;
    }
    .seat-card.vacant {
      display: none !important; /* 空號完全隱藏不顯示按鈕 */
    }

    .seat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      line-height: 1;
    }
    .seat-num {
      font-size: 0.85rem;
      font-weight: 800;
      color: #94a3b8;
    }
    .seat-card.selected .seat-num {
      color: #facc15;
    }
    .seat-name {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60px;
    }

    .seat-score {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 900;
      color: #f8fafc;
      margin: 2px 0;
      letter-spacing: -0.5px;
    }
    .seat-score.empty {
      color: #475569;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .seat-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gray-dot);
    }
    .status-dot.green {
      background: #10b981;
      box-shadow: 0 0 5px rgba(16, 185, 129, 0.7);
    }
    .status-dot.orange {
      background: #f97316;
      box-shadow: 0 0 5px rgba(249, 115, 22, 0.8);
    }
    .status-dot.blue {
      background: #38bdf8;
      box-shadow: 0 0 5px rgba(56, 189, 248, 0.8);
    }

    /* ✍️ 右側：左手操作評分控制台 */
    .action-panel {
      flex: 1.15;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      height: 100%;
    }

    /* 1. 等第快捷橫列 (7等第 + ⚙️) */
    .grades-bar {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      flex-shrink: 0;
    }

    .grade-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 0;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
    }
    .grade-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .grade-btn:active {
      transform: scale(0.94);
      background: #0284c7;
      color: #fff;
    }
    .grade-btn.settings-btn {
      background: #0f172a;
      border-color: #334155;
      color: #94a3b8;
    }

    /* 2. 下半部雙欄佈局 (左側九宮格塞入並延伸到底，右側看板 + 最右下操作鈕) */
    .panel-lower-grid {
      display: flex;
      flex: 1;
      gap: 8px;
      overflow: hidden;
      min-height: 0;
    }

    /* 左半：數字鍵盤區 (往上塞入並往下延伸到底) */
    .keypad-section {
      flex: 1.25;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      height: 100%;
      min-height: 0;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      flex: 1;
      height: 100%;
      min-height: 0;
    }

    .key-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }
    .key-btn:active {
      background: #475569;
      transform: scale(0.95);
    }
    .key-btn.action-key {
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .key-btn.hundred-key {
      color: #facc15;
      font-weight: 800;
    }

    /* 底部小設定列 */
    .bottom-opts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #64748b;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .bottom-opts label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* 右半：上方看板 + 最右下需訂正與下一號 */
    .right-action-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      height: 100%;
      min-height: 0;
    }

    /* 📺 最右側正方形高對比大看板 (右上) */
    .score-display-box {
      width: 100%;
      flex: 1.1;
      max-height: 125px;
      background: #030712;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 6px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .display-seat-info {
      font-size: 0.82rem;
      font-weight: 800;
      color: #facc15;
      text-align: center;
      line-height: 1.1;
    }

    .display-score-huge {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    .display-score-huge.empty {
      color: #475569;
      font-size: 1.6rem;
    }

    .display-grade-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 8px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    /* 最右下操作鈕群 (需訂正 + 下一號) */
    .right-bottom-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .toggle-correction-btn {
      height: 38px;
      background: #1e293b;
      color: #94a3b8;
      border: 1.5px solid #334155;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .toggle-correction-btn.active {
      background: rgba(249, 115, 22, 0.2);
      border-color: #f97316;
      color: #f97316;
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.3);
    }
    .toggle-correction-btn:active {
      transform: scale(0.97);
    }

    .next-student-btn {
      height: 40px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }
    .next-student-btn:active {
      transform: scale(0.97);
      background: #0369a1;
    }

    /* 彈窗樣式 (Modal) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px;
    }
    .modal-overlay.hidden {
      display: none;
    }
    .modal-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #131b2e;
    }
    .modal-header h3 {
      font-size: 1rem;
      color: #f8fafc;
      font-weight: 700;
    }
    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0 4px;
    }
    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-footer {
      padding: 10px 16px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #131b2e;
    }

    .opt-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .opt-card:hover {
      border-color: #38bdf8;
      background: #24324a;
    }
    .opt-card.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
    }

    /* Toast Banner */
    .toast-banner {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 2000;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    .toast-banner.success { background: #10b981; color: #fff; }
    .toast-banner.orange { background: #f97316; color: #fff; }
    .toast-banner.error { background: #ef4444; color: #fff; }
    .toast-banner.info { background: #0284c7; color: #fff; }

    /* 直向模式自適應排版 (Portrait Fallback) */
    @media (orientation: portrait) {
      .main-workspace {
        flex-direction: column;
        overflow-y: auto;
      }
      .seat-grid-container {
        height: 52%;
        flex: none;
        border-right: none;
        border-bottom: 1px solid #1e293b;
      }
      .action-panel {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部單列整合列 -->
  <header>
    <div class="header-left">
      <select id="subject-select" class="subject-select" onchange="onSubjectChange()">
        <option value="國語|甲本">國語 甲本</option>
        <option value="國語|乙本">國語 乙本</option>
        <option value="國語|國習">國語 國習</option>
        <option value="國語|圈詞">國語 圈詞</option>
        <option value="數學|數習">數學 數習</option>
        <option value="社會|社習">社會 社習</option>
        <option value="日記|日記">日記 日記</option>
        <option value="國語|作文">國語 作文</option>
      </select>

      <div class="assign-meta-pill" id="assign-meta-pill">
        📅 <span id="meta-date">----/--/--</span>
        📖 單元: <b id="meta-unit">-</b>
        📄 頁數: <b id="meta-page">-</b>
      </div>

      <button class="header-btn" onclick="openOtherPageModal()">📅 它頁</button>
      <button class="header-btn" onclick="openNewAssignModal()">➕ 新作業</button>
    </div>

    <div class="header-right">
      <button class="header-nav-btn nav-btn-pair" id="btn-init-sheets" onclick="initAllSheetsFromUI()" style="display:none; color:#38bdf8; border-color:#0284c7;" title="一鍵初始化目前試算表的 8 大作業成績分頁">初始化</button>
      <a href="index.html" class="header-nav-btn nav-btn-check" id="link-index" title="作業清點">清點</a>
      <a href="correction.html" class="header-nav-btn nav-btn-cor" id="link-correction" title="錯題訂正">訂正</a>
      <span class="header-nav-btn nav-btn-grade active" title="目前在作業批改">批改</span>
      <button class="header-nav-btn nav-btn-pair" onclick="openPairModal()" title="連線設定">連線</button>
      <button class="header-nav-btn nav-btn-reload" onclick="forceHardReload()" title="強制更新最新版本">刷新</button>
    </div>
  </header>

  <!-- 主工作區 (橫向佈局：左側座號矩陣，右側評分控制台) -->
  <div class="main-workspace">

    <!-- 📋 左側：30 座號矩陣區 -->
    <div class="seat-grid-container" id="seat-grid">
      <!-- 由 JavaScript 動態生成 30 個 seat-card -->
    </div>

    <!-- ✍️ 右側：左手操作評分控制台 -->
    <div class="action-panel">

  <script>
    // ── 全域狀態與設定 ──
    const DEFAULT_PRESETS = {
      "甲上上": 98,
      "甲上": 95,
      "甲": 90,
      "甲下": 85,
      "乙上": 79,
      "乙": 75,
      "乙下": 70
    };

    let gradePresets = { ...DEFAULT_PRESETS };
    let currentSheetName = "國語|甲本";
    let gradingDataCache = null;
    let selectedSeat = 1;
    let currentNeedCorrection = false;
    let currentInputScore = "";
    let isSaving = false;

    // ── 連線與 API 設定 ──
    function cleanGasUrl(url) {
      if (!url || typeof url !== 'string') return '';
      let clean = url.trim();
      try {
        if (clean.includes('%3A') || clean.includes('%2F')) clean = decodeURIComponent(clean);
      } catch(e){}
      if (/^AKfy[A-Za-z0-9_-]{40,}$/.test(clean)) {
        return `https://script.google.com/macros/s/${clean}/exec`;
      }
      return clean.replace(/https?:\/\/script\.google\.com\/a\/[^\/]+\//i, 'https://script.google.com/').trim();
    }

    function getGasApiUrl() {
      // 1. 網址列參數（例如掃碼進入帶入的 ?api_url=...）優先權最高，並立即寫入本機儲存
      const urlParams = new URLSearchParams(window.location.search);
      const paramGas = urlParams.get('api_url') || urlParams.get('gas') || urlParams.get('gas_url');
      if (paramGas) {
        const clean = cleanGasUrl(paramGas);
        try {
          localStorage.setItem('class_management_gas_api_url', clean);
          localStorage.setItem('class_mgmt_gas_api_url', clean);
        } catch(e){}
        return clean;
      }

      // 2. 若當前就在 GAS 容器網址內執行，直接取用容器網址或外層 referrer
      if (typeof window._GAS_WEBAPP_URL === 'string' && window._GAS_WEBAPP_URL.includes('script.google.com')) {
        return cleanGasUrl(window._GAS_WEBAPP_URL);
      }
      if (location.hostname.includes('script.google.com') && !location.hostname.includes('googleusercontent.com')) {
        return cleanGasUrl(location.href.split('?')[0]);
      }
      if (document.referrer && document.referrer.includes('script.google.com/macros/s/')) {
        const cleanRef = cleanGasUrl(document.referrer.split('?')[0]);
        try {
          localStorage.setItem('class_management_gas_api_url', cleanRef);
          localStorage.setItem('class_mgmt_gas_api_url', cleanRef);
        } catch(e){}
        return cleanRef;
      }

      // 3. 【核心連線依據】：使用者掃碼或手動設定儲存在 localStorage 的試算表網址！
      // 跨清點、訂正、批改三大功能完全一致，使用者建立副本後以其自己掃碼綁定的網址為唯一標準
      const stored = localStorage.getItem('class_management_gas_api_url') || localStorage.getItem('class_mgmt_gas_api_url');
      if (stored && stored !== 'YOUR_GAS_WEB_APP_URL') {
        return cleanGasUrl(stored);
      }

      // 4. 若本機尚未進行任何掃碼或綁定，僅作為開發備用 fallback
      if (typeof window.GAS_API_URL === 'string' && window.GAS_API_URL.includes('script.google.com')) {
        return cleanGasUrl(window.GAS_API_URL);
      }
      return '';
    }

    let GAS_API_URL = getGasApiUrl();

    async function gasApi(action, params = {}) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => reject(err))
            .handleScannerApiAction(action, params);
        });
      } else {
        if (!GAS_API_URL) throw new Error('尚未設定 GAS API 網址，請先點擊右上角「🔗 連線」綁定');
        const cleanBase = cleanGasUrl(GAS_API_URL);
        const url = new URL(cleanBase);
        url.searchParams.set('action', action);
        for (const [k, v] of Object.entries(params)) {
          url.searchParams.set(k, v);
        }
        const retries = (action === 'getGradingData' || action === 'initAllScoreSheets') ? 1 : 0;
        return await gasApiFetch(url.toString(), retries, 25000);
      }
    }

    async function gasApiFetch(url, retries = 1, timeoutMs = 25000) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          return await singleGasApiFetch(url, timeoutMs);
        } catch (err) {
          console.warn(`[GAS API] 第 ${attempt + 1} 次連線失敗: ${err.message}`);
          if (attempt < retries) {
            await new Promise(r => setTimeout(r, 1200));
          } else {
            throw err;
          }
        }
      }
    }

    function singleGasApiFetch(url, timeoutMs = 25000) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gas_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const sep = url.includes('?') ? '&' : '?';
        const finalUrl = url + sep + 'callback=' + callbackName + '&_t=' + Date.now();
        let isSettled = false;
        let scriptTag = null;

        const timer = setTimeout(() => {
          if (isSettled) return;
          isSettled = true;
          cleanup();
          reject(new Error('伺服器回應較慢 (逾時)，可能是首次建立分頁或冷啟動中，請再試一次'));
        }, timeoutMs);

        function cleanup() {
          try { delete window[callbackName]; } catch(e){}
          if (scriptTag && scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
        }

        window[callbackName] = function(data) {
          if (isSettled) return;
          isSettled = true;
          clearTimeout(timer);
          cleanup();
          resolve(data);
        };

        // 直接採用跨域最穩定之 JSONP Script 標籤，不發送多餘 fetch 避免引發伺服器分頁建立競爭衝突
        scriptTag = document.createElement('script');
        scriptTag.crossOrigin = 'anonymous';
        scriptTag.src = finalUrl;
        scriptTag.onerror = () => {
          if (isSettled) return;
          isSettled = true;
          clearTimeout(timer);
          cleanup();
          reject(new Error('連線失敗 (請確認 GAS 部署「誰可以存取」是否設為「所有人」)'));
        };
        document.head.appendChild(scriptTag);
      });
    }

    // ── 一鍵初始化 8 大成績分頁（僅在分頁尚未建齊時顯示，建好後自動隱藏） ──
    function updateInitButtonsVisibility(show) {
      const b1 = document.getElementById('btn-init-sheets');
      const b2 = document.getElementById('btn-init-sheets-modal');
      if (b1) b1.style.display = show ? '' : 'none';
      if (b2) b2.style.display = show ? '' : 'none';
    }

    async function initAllSheetsFromUI() {
      if (!confirm('是否要為目前試算表一鍵建立並初始化 8 大作業成績分頁（國語甲乙本、國習、數習、社習、日記、作文）？\n\n建立後將自動帶入學生座號與名單！')) return;
      showToast('⏳ 正在為您的試算表建立 8 大作業成績分頁，請稍候約 5~10 秒...', 'info');
      try {
        const res = await gasApi('initAllScoreSheets');
        if (res && res.success) {
          updateInitButtonsVisibility(false);
          showToast('🎉 ' + res.message, 'success');
          fetchGradingData();
        } else {
          showToast('❌ 初始化失敗: ' + (res ? res.message : ''), 'error');
        }
      } catch(err) {
        showToast('❌ 連線異常: ' + err.message, 'error');
      }
    }

    // ── 初始化 ──
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedPresets();
      initSeatGridUI();
      fetchGradingData();
      adaptInternalLinks();
    });

    function loadSavedPresets() {
      try {
        const saved = localStorage.getItem('class_mgmt_grade_presets');
        if (saved) gradePresets = { ...DEFAULT_PRESETS, ...JSON.parse(saved) };
      } catch(e){}
    }

    function initSeatGridUI() {
      const container = document.getElementById('seat-grid');
      container.innerHTML = '';
      for (let s = 1; s <= 30; s++) {
        const seatStr = String(s).padStart(2, '0');
        const div = document.createElement('div');
        div.id = `seat-card-${s}`;
        div.className = `seat-card ungraded ${s === selectedSeat ? 'selected' : ''}`;
        div.onclick = () => onSeatCardClick(s);
        div.innerHTML = `
          <div class="seat-header">
            <span class="seat-num">${seatStr}</span>
            <span class="seat-name" id="seat-name-${s}">載入中...</span>
          </div>
          <div class="seat-score empty" id="seat-score-${s}">--</div>
          <div class="seat-footer">
            <div class="status-dot" id="dot-chk-${s}" title="清點繳交狀態"></div>
            <div class="status-dot" id="dot-cor-${s}" title="錯題訂正狀態"></div>
          </div>
        `;
        container.appendChild(div);
      }
    }

    // ── 抓取並渲染批改資料 ──
    async function fetchGradingData(targetColIndex = null) {
      showToast('⏳ 正在同步作業成績與批改進度...', 'info');
      try {
        const params = { sheetName: currentSheetName };
        if (targetColIndex) params.colIndex = targetColIndex;

        const res = await gasApi('getGradingData', params);
        if (res && res.success) {
          gradingDataCache = res;
          updateInitButtonsVisibility(res.allScoreSheetsReady === false);
          if (res.presets) {
            gradePresets = { ...DEFAULT_PRESETS, ...res.presets };
            try { localStorage.setItem('class_mgmt_grade_presets', JSON.stringify(gradePresets)); } catch(e){}
          }
          renderHeaderMeta();
          renderAllSeats();
          updateSelectedStudentDisplay();
          showToast(`🟢 已載入【${currentSheetName}】批改資料`, 'success');
        } else {
          if (res && res.message && res.message.includes('未知的 API 動作')) {
            showToast('⚠️ 目前綁定的試算表尚未發布最新評分程式，請至該試算表「擴充功能 > Apps Script > 管理部署」發布新版本', 'orange');
            return;
          }
          showToast('❌ 載入失敗: ' + (res ? res.message : ''), 'error');
        }
      } catch (err) {
        showToast('❌ 連線異常: ' + err.message, 'error');
      }
    }

    function renderHeaderMeta() {
      if (!gradingDataCache) return;
      const assign = gradingDataCache.currentAssignment;
      document.getElementById('meta-date').textContent = assign ? (assign.date || '未定') : '尚未開立作業';
      document.getElementById('meta-unit').textContent = assign ? (assign.unit || '-') : '-';
      document.getElementById('meta-page').textContent = assign ? (assign.page || '-') : '-';
    }

    function isStudentVacant(st) {
      if (!st) return false;
      const n = String(st.name || '').trim();
      if (!n) return false; // 姓名尚未填寫時，保留顯示座號按鈕
      if (st.isVacant === true) return true;
      if (n === '空號' || n === '轉出' || n === '空' || n.includes('空號') || n.includes('轉出')) return true;
      return false;
    }

    function renderAllSeats() {
      if (!gradingDataCache || !gradingDataCache.students) return;

      // 若當前選中的學生是空號，自動切換至第一個非空號學生
      const curSt = gradingDataCache.students.find(x => parseInt(x.seat, 10) === selectedSeat);
      if (!curSt || isStudentVacant(curSt)) {
        const firstValid = gradingDataCache.students.find(x => !isStudentVacant(x));
        if (firstValid) {
          selectedSeat = parseInt(firstValid.seat, 10);
        }
      }

      gradingDataCache.students.forEach(st => {
        const s = parseInt(st.seat, 10);
        const card = document.getElementById(`seat-card-${s}`);
        const nameEl = document.getElementById(`seat-name-${s}`);
        const scoreEl = document.getElementById(`seat-score-${s}`);
        const dotChk = document.getElementById(`dot-chk-${s}`);
        const dotCor = document.getElementById(`dot-cor-${s}`);

        if (!card) return;

        // 空號完全隱藏不顯示按鈕
        if (isStudentVacant(st)) {
          card.className = 'seat-card vacant';
          card.style.display = 'none';
          return;
        }

        card.style.display = 'flex';
        nameEl.textContent = st.name || '';

        // 分數與已給分外框 (紫色)
        if (st.score && st.score !== '--') {
          scoreEl.textContent = st.score;
          scoreEl.className = 'seat-score';
          card.className = `seat-card graded ${s === selectedSeat ? 'selected' : ''}`;
        } else {
          scoreEl.textContent = '--';
          scoreEl.className = 'seat-score empty';
          card.className = `seat-card ungraded ${s === selectedSeat ? 'selected' : ''}`;
        }

        // 左燈：繳交狀態 (綠燈 1 / 灰燈)
        dotChk.className = st.checkin ? 'status-dot green' : 'status-dot';

        // 右燈：訂正狀態 (橘燈 X / 天藍燈 O / 灰燈 無)
        if (st.correction === 'X') {
          dotCor.className = 'status-dot orange';
        } else if (st.correction === 'O') {
          dotCor.className = 'status-dot blue';
        } else {
          dotCor.className = 'status-dot';
        }
      });
    }

    // ── 座號點選與自動儲存 ──
    async function onSeatCardClick(seatNum) {
      const st = gradingDataCache?.students?.find(x => parseInt(x.seat, 10) === seatNum);
      if (st && isStudentVacant(st)) return;
      if (seatNum === selectedSeat) return;
      triggerFeedback('light');

      // 若當前有尚未提交的輸入分數，切換時自動儲存
      if (currentInputScore !== "") {
        await submitCurrentScore(false);
      }

      selectSeat(seatNum);
    }

    function selectSeat(seatNum) {
      selectedSeat = seatNum;
      currentInputScore = "";

      // 更新卡片選中外框並自動滾動至可見區域
      for (let s = 1; s <= 30; s++) {
        const card = document.getElementById(`seat-card-${s}`);
        if (!card) continue;
        if (s === selectedSeat) {
          card.classList.add('selected');
          try { card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch(e){}
        } else {
          card.classList.remove('selected');
        }
      }

      // 載入該生目前狀態
      if (gradingDataCache && gradingDataCache.students) {
        const st = gradingDataCache.students.find(x => parseInt(x.seat, 10) === selectedSeat);
        if (st) {
          currentNeedCorrection = (st.correction === 'X');
        } else {
          currentNeedCorrection = false;
        }
      }

      updateSelectedStudentDisplay();
      updateCorrectionBtnUI();
    }

    function updateSelectedStudentDisplay() {
      const infoEl = document.getElementById('display-seat-info');
      const scoreEl = document.getElementById('display-score-huge');
      const badgeEl = document.getElementById('display-grade-badge');

      let name = '';
      let score = '';

      if (gradingDataCache && gradingDataCache.students) {
        const st = gradingDataCache.students.find(x => parseInt(x.seat, 10) === selectedSeat);
        if (st) {
          name = st.name || '';
          score = st.score || '';
        }
      }

      const seatStr = String(selectedSeat).padStart(2, '0');
      infoEl.textContent = `${seatStr} 號  ${name}`;

      const displayScore = currentInputScore !== "" ? currentInputScore : score;

      if (displayScore && displayScore !== '--') {
        scoreEl.textContent = displayScore;
        scoreEl.className = 'display-score-huge';
        badgeEl.textContent = getGradeNameFromScore(displayScore);
      } else {
        scoreEl.textContent = '--';
        scoreEl.className = 'display-score-huge empty';
        badgeEl.textContent = '尚未給分';
      }
    }

    function getGradeNameFromScore(val) {
      const num = parseFloat(val);
      if (isNaN(num)) return val;
      for (const [grade, target] of Object.entries(gradePresets)) {
        if (num === target) return `【${grade}】`;
      }
      if (num >= 98) return '【甲上上】';
      if (num >= 95) return '【甲上】';
      if (num >= 90) return '【甲】';
      if (num >= 85) return '【甲下】';
      if (num >= 79) return '【乙上】';
      if (num >= 75) return '【乙】';
      if (num >= 70) return '【乙下】';
      return `【${val}分】`;
    }

    // ── 等第與數字鍵盤操作 ──
    async function onGradeClick(gradeKey) {
      triggerFeedback('medium');
      const scoreVal = gradePresets[gradeKey] || 90;
      currentInputScore = String(scoreVal);
      updateSelectedStudentDisplay();
      await submitCurrentScore();
    }

    function onNumKey(key) {
      triggerFeedback('light');
      if (key === 'clear') {
        currentInputScore = "";
      } else if (key === 'backspace') {
        currentInputScore = currentInputScore.slice(0, -1);
      } else if (key === '100') {
        currentInputScore = "100";
      } else {
        if (currentInputScore.length < 5) {
          currentInputScore += key;
        }
      }
      updateSelectedStudentDisplay();
    }

    function toggleNeedCorrection() {
      triggerFeedback('medium');
      currentNeedCorrection = !currentNeedCorrection;
      updateCorrectionBtnUI();

      // 若目前已有分數，切換需訂正直接同步儲存
      const score = currentInputScore || (gradingDataCache?.students?.find(x => parseInt(x.seat,10) === selectedSeat)?.score);
      if (score) {
        submitCurrentScore(false);
      }
    }

    function updateCorrectionBtnUI() {
      const btn = document.getElementById('toggle-correction-btn');
      const icon = document.getElementById('correction-icon');
      if (currentNeedCorrection) {
        btn.className = 'toggle-correction-btn active';
        icon.textContent = '🟧';
      } else {
        btn.className = 'toggle-correction-btn';
        icon.textContent = '⚪';
      }
    }

    // ── 儲存成績 ──
    async function submitCurrentScore(shouldAdvance = null) {
      if (isSaving) return;
      if (!gradingDataCache || !gradingDataCache.currentAssignment) {
        showToast('⚠️ 尚未選定作業欄位，請先選擇或建立作業', 'orange');
        return;
      }

      const st = gradingDataCache.students.find(x => parseInt(x.seat, 10) === selectedSeat);
      const scoreToSave = currentInputScore !== "" ? currentInputScore : (st ? st.score : '');

      if (!scoreToSave || scoreToSave === '--') {
        showToast('⚠️ 請先點選等第或輸入分數', 'orange');
        return;
      }

      isSaving = true;
      document.getElementById('save-status-indicator').textContent = '⏳ 儲存中...';
      document.getElementById('save-status-indicator').style.color = '#f59e0b';

      const seatStr = String(selectedSeat).padStart(2, '0');
      const assign = gradingDataCache.currentAssignment;

      const payload = {
        sheetName: currentSheetName,
        colIndex: assign.colIndex,
        seat: seatStr,
        score: scoreToSave,
        needCorrection: currentNeedCorrection,
        unit: assign.unit || '',
        page: assign.page || '',
        date: assign.date || ''
      };

      try {
        const res = await gasApi('saveStudentGrade', payload);
        if (res && res.success) {
          triggerFeedback('success');
          // 更新本機快取
          if (st) {
            st.score = scoreToSave;
            st.checkin = true;
            st.correction = res.correction || (currentNeedCorrection ? 'X' : '');
            st.graded = true;
          }
          currentInputScore = "";
          renderAllSeats();
          updateSelectedStudentDisplay();

          let msg = res.message || `已登記 ${seatStr}號 【${scoreToSave}分】`;
          showToast(msg, 'success');

          // 自動跳號判斷
          const autoAdvance = (shouldAdvance !== null) ? shouldAdvance : document.getElementById('auto-advance-chk').checked;
          if (autoAdvance) {
            goToNextStudent(false);
          }
        } else {
          showToast('❌ 儲存失敗: ' + (res ? res.message : ''), 'error');
        }
      } catch (err) {
        showToast('❌ 連線失敗: ' + err.message, 'error');
      } finally {
        isSaving = false;
        document.getElementById('save-status-indicator').textContent = '🟢 已連線就緒';
        document.getElementById('save-status-indicator').style.color = '#10b981';
      }
    }

    function goToNextStudent(triggerSave = true) {
      if (triggerSave && currentInputScore !== "") {
        submitCurrentScore(false);
      }
      let next = selectedSeat + 1;
      let count = 0;
      while (count < 30) {
        if (next > 30) next = 1;
        const st = gradingDataCache?.students?.find(x => parseInt(x.seat, 10) === next);
        if (st && !isStudentVacant(st)) {
          selectSeat(next);
          return;
        }
        next++;
        count++;
      }
      showToast('已無其他有效學生座號', 'info');
    }

    // ── 科目與它頁彈窗切換 ──
    async function onSubjectChange() {
      const select = document.getElementById('subject-select');
      currentSheetName = select.value;
      await fetchGradingData();

      // 若工作表1有多筆收繳紀錄，自動彈出它頁選單
      if (gradingDataCache && gradingDataCache.checkinAssignments && gradingDataCache.checkinAssignments.length > 1) {
        openOtherPageModal();
      }
    }

    function openOtherPageModal() {
      const modal = document.getElementById('other-page-modal');
      const listEl = document.getElementById('other-page-list');
      const titleEl = document.getElementById('other-page-title');

      titleEl.textContent = `📅 選擇【${currentSheetName}】單元與頁數`;
      listEl.innerHTML = '';

      const checkinList = gradingDataCache ? (gradingDataCache.checkinAssignments || []) : [];
      const scoreAssignments = gradingDataCache ? (gradingDataCache.assignments || []) : [];

      if (checkinList.length === 0 && scoreAssignments.length === 0) {
        listEl.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:15px;">清點表尚未有此科目的收繳紀錄，請點「➕ 新作業」開立</div>';
      } else {
        // 優先顯示清點表的收繳紀錄（依日期排列）
        checkinList.forEach(item => {
          const card = document.createElement('div');
          const isCurr = gradingDataCache?.currentAssignment?.unit === item.unit &&
                         gradingDataCache?.currentAssignment?.page === item.page;
          card.className = `opt-card ${isCurr ? 'active' : ''}`;
          card.onclick = () => selectCheckinAssignment(item);
          card.innerHTML = `
            <div>
              <span style="font-weight:800; color:#38bdf8; font-size:0.95rem;">📖 單元: ${item.unit || '(未填)'}</span>
              <span style="color:#cbd5e1; font-size:0.85rem; margin-left:8px;">📄 頁數: ${item.page || '(未填)'}</span>
            </div>
            <div style="font-size:0.8rem; color:#facc15; font-weight:700;">📅 ${item.date || ''}</div>
          `;
          listEl.appendChild(card);
        });
      }

      modal.classList.remove('hidden');
    }

    function closeOtherPageModal() {
      document.getElementById('other-page-modal').classList.add('hidden');
    }

    async function selectCheckinAssignment(item) {
      closeOtherPageModal();
      showToast(`⏳ 正在切換至【單元: ${item.unit} 頁數: ${item.page}】...`, 'info');
      await fetchGradingData(null);
      // 比對並選中該作業
      const matched = gradingDataCache.assignments.find(a => a.unit === item.unit && a.page === item.page);
      if (matched) {
        await fetchGradingData(matched.colIndex);
      } else {
        // 若成績分頁尚未開立此欄，即時開立
        await gasApi('createScoreAssignment', {
          sheetName: currentSheetName,
          date: item.date,
          unit: item.unit,
          page: item.page
        });
        await fetchGradingData();
      }
    }

    // ── 新作業自訂彈窗 ──
    function openNewAssignModal() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('new-date-input').value = today;
      document.getElementById('new-unit-input').value = '';
      document.getElementById('new-page-input').value = '';
      document.getElementById('new-assign-modal').classList.remove('hidden');
    }

    function closeNewAssignModal() {
      document.getElementById('new-assign-modal').classList.add('hidden');
    }

    async function submitNewAssign() {
      const date = document.getElementById('new-date-input').value.trim();
      const unit = document.getElementById('new-unit-input').value.trim();
      const page = document.getElementById('new-page-input').value.trim();

      if (!unit && !page) {
        showToast('⚠️ 請至少輸入單元或頁數', 'orange');
        return;
      }

      closeNewAssignModal();
      showToast('⏳ 正在建立新作業欄位...', 'info');

      try {
        const res = await gasApi('createScoreAssignment', {
          sheetName: currentSheetName,
          date: date,
          unit: unit,
          page: page
        });
        if (res && res.success) {
          showToast(`🟢 ${res.message}`, 'success');
          await fetchGradingData(res.colIndex);
        } else {
          showToast('❌ 建立失敗: ' + (res ? res.message : ''), 'error');
        }
      } catch (err) {
        showToast('❌ 連線錯誤: ' + err.message, 'error');
      }
    }

    // ── 等第設定彈窗 ──
    function openSettingsModal() {
      const container = document.getElementById('settings-presets-list');
      container.innerHTML = '';
      for (const [grade, score] of Object.entries(gradePresets)) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:4px 0;';
        row.innerHTML = `
          <span style="font-weight:700; color:#38bdf8; font-size:0.95rem;">${grade}</span>
          <input type="number" id="preset-${grade}" value="${score}" style="background:#1e293b; border:1px solid #475569; color:#fff; width:80px; padding:4px 8px; border-radius:6px; font-weight:800; text-align:center;">
        `;
        container.appendChild(row);
      }
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function resetDefaultPresets() {
      gradePresets = { ...DEFAULT_PRESETS };
      openSettingsModal();
      showToast('已還原為標準預設等第分數', 'info');
    }

    async function savePresetsSettings() {
      const updated = {};
      for (const grade of Object.keys(DEFAULT_PRESETS)) {
        const input = document.getElementById(`preset-${grade}`);
        if (input) {
          const val = parseFloat(input.value);
          updated[grade] = isNaN(val) ? DEFAULT_PRESETS[grade] : val;
        }
      }
      gradePresets = updated;
      try { localStorage.setItem('class_mgmt_grade_presets', JSON.stringify(gradePresets)); } catch(e){}
      closeSettingsModal();
      showToast('🟢 等第分數設定已儲存', 'success');

      // 同步存至後端 ScriptProperties
      try {
        await gasApi('saveScorePresets', { presets: JSON.stringify(gradePresets) });
      } catch(e){}
    }

    // ── 連線設定彈窗 ──
    function openPairModal() {
      document.getElementById('gas-url-input').value = GAS_API_URL || '';
      document.getElementById('pair-modal').classList.remove('hidden');
    }

    function closePairModal() {
      document.getElementById('pair-modal').classList.add('hidden');
    }

    function savePairGasUrl() {
      const input = document.getElementById('gas-url-input').value.trim();
      if (!input) {
        showToast('⚠️ 請輸入有效的 GAS 網址', 'orange');
        return;
      }
      const clean = cleanGasUrl(input);
      GAS_API_URL = clean;
      try {
        localStorage.setItem('class_management_gas_api_url', clean);
        localStorage.setItem('class_mgmt_gas_api_url', clean);
      } catch(e){}
      closePairModal();
      showToast('🟢 連線設定已儲存，正在重新連線...', 'success');
      fetchGradingData();
    }

    function clearPairGasUrl() {
      document.getElementById('gas-url-input').value = '';
      try {
        localStorage.removeItem('class_management_gas_api_url');
        localStorage.removeItem('class_mgmt_gas_api_url');
      } catch(e){}
      GAS_API_URL = '';
      closePairModal();
      showToast('⚠️ 已解除試算表綁定，請重新輸入或掃碼連線', 'info');
    }

    // ── 工具函式 ──
    function showToast(msg, type = 'success') {
      const banner = document.getElementById('toast-banner');
      banner.className = `toast-banner ${type}`;
      banner.textContent = msg;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 3000);
    }

    function triggerFeedback(type) {
      if (navigator.vibrate) {
        if (type === 'success') navigator.vibrate([80, 40, 80]);
        else if (type === 'medium') navigator.vibrate(50);
        else navigator.vibrate(20);
      }
    }

    function adaptInternalLinks() {
      const isGas = (typeof google !== 'undefined' && google.script && google.script.run) ||
                    location.hostname.includes('script.google.com') ||
                    location.hostname.includes('googleusercontent.com');
      if (!isGas) return;

      // 優先偵測目前網頁自身所在的 GAS Web App URL（精準對齊當前副本）
      let baseGas = '';
      if (location.hostname.includes('script.google.com')) {
        baseGas = location.href.split('?')[0];
      } else if (document.referrer && document.referrer.includes('script.google.com/macros/s/')) {
        baseGas = document.referrer.split('?')[0];
      } else if (typeof window._GAS_WEBAPP_URL === 'string' && window._GAS_WEBAPP_URL.includes('script.google.com')) {
        baseGas = window._GAS_WEBAPP_URL;
      } else if (typeof GAS_API_URL === 'string' && GAS_API_URL.includes('script.google.com')) {
        baseGas = GAS_API_URL;
      }

      if (!baseGas) return;
      baseGas = cleanGasUrl(baseGas);

      const linkCor = document.getElementById('link-correction');
      const linkIdx = document.getElementById('link-index');
      if (linkCor) { linkCor.href = `${baseGas}?page=correction`; linkCor.target = '_top'; }
      if (linkIdx) { linkIdx.href = `${baseGas}`; linkIdx.target = '_top'; }
    }

    function forceHardReload() {
      showToast('🔄 正在強制更新最新版面...', 'info');
      try {
        if ('caches' in window) {
          caches.keys().then(names => {
            names.forEach(name => caches.delete(name));
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(reg => reg.unregister());
          });
        }
      } catch(e){}

      setTimeout(() => {
        const url = new URL(window.location.href);
        url.searchParams.set('_t', Date.now());
        window.location.href = url.toString();
      }, 400);
    }
  </script>
</body>
