<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Code 最大尺寸與滿版極限基準測試 (Size Benchmark)</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151d2f;
      --input-bg: #222f49;
      --border: #334466;
      --accent: #38bdf8;
      --c-95: #ef4444; /* 95% 極限 */
      --c-80: #f97316; /* 80% 超大 */
      --c-60: #eab308; /* 60% 大碼 */
      --c-40: #22c55e; /* 40% 中等 */
      --c-20: #06b6d4; /* 20% 遠距 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0f172a;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 0.95rem; color: var(--accent); }

    /* 攝影機視野與同心標尺 */
    .viewport {
      position: relative;
      width: 100%;
      height: 48vh;
      min-height: 300px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #qr-shaded-region { display: none !important; }

    /* 同心尺寸標靶層 */
    .target-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .ring {
      position: absolute;
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 4px;
      transition: all 0.2s ease;
    }
    .ring .ring-label {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      color: #fff;
    }

    .ring-95 {
      width: 95%; height: 95%;
      border: 2px dashed var(--c-95);
      background: rgba(239, 68, 68, 0.04);
    }
    .ring-95 .ring-label { background: var(--c-95); }

    .ring-80 {
      width: 80%; height: 80%;
      border: 2px dashed var(--c-80);
      background: rgba(249, 115, 22, 0.04);
    }
    .ring-80 .ring-label { background: var(--c-80); }

    .ring-60 {
      width: 60%; height: 60%;
      border: 2px dashed var(--c-60);
      background: rgba(234, 179, 8, 0.04);
    }
    .ring-60 .ring-label { background: var(--c-60); }

    .ring-40 {
      width: 40%; height: 40%;
      border: 2px dashed var(--c-40);
      background: rgba(34, 197, 94, 0.05);
    }
    .ring-40 .ring-label { background: var(--c-40); }

    .ring-20 {
      width: 20%; height: 20%;
      border: 1px dashed var(--c-20);
    }
    .ring-20 .ring-label { background: var(--c-20); }

    /* 掃碼成功時的視覺閃光 */
    .flash-success {
      position: absolute;
      inset: 0;
      background: rgba(34, 197, 94, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 30;
    }
    .flash-success.show { opacity: 1; }

    /* 控制面板 */
    .controls {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .panel h2 {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .btn-mode {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .btn-mode.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
    }
    .btn-mode span {
      display: block;
      font-size: 0.68rem;
      color: #94a3b8;
      margin-top: 3px;
    }

    .result-banner {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
    }
    .result-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .result-history {
      font-family: monospace;
      font-size: 0.72rem;
      color: #cbd5e1;
      max-height: 100px;
      overflow-y: auto;
      margin-top: 6px;
    }

    .badge-record {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-right: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>📏 QR Code 最大尺寸與極限距離測試</h1>
    <span id="fps-indicator" style="font-size:0.75rem; color:#38bdf8; font-family:monospace;">10 FPS</span>
  </header>

  <div class="viewport">
    <div id="reader"></div>

    <!-- 同心尺寸標尺：測量 QR Code 放大到畫面百分之幾還能掃 -->
    <div class="target-overlay">
      <div class="ring ring-95"><span class="ring-label">95% 滿版極限</span></div>
      <div class="ring ring-80"><span class="ring-label">80% 超大近拍</span></div>
      <div class="ring ring-60"><span class="ring-label">60% 大碼</span></div>
      <div class="ring ring-40"><span class="ring-label">40% 一般標準</span></div>
      <div class="ring ring-20"><span class="ring-label">20% 遠距</span></div>
    </div>

    <div class="flash-success" id="flash"></div>
  </div>

  <div class="controls">

    <!-- 測試模式選擇 -->
    <div class="panel">
      <h2>🎯 選擇取樣測試模式</h2>
      <div class="btn-grid">
        <button class="btn-mode" onclick="switchTestMode('fixed_180')">
          1️⃣ 自用版小取樣框
          <span>qrbox: 180px (測試大條碼是否被截斷)</span>
        </button>
        <button class="btn-mode" onclick="switchTestMode('fixed_280')">
          2️⃣ 分享版中取樣框
          <span>qrbox: 280px</span>
        </button>
        <button class="btn-mode active" onclick="switchTestMode('full_frame')">
          3️⃣ 滿版全畫面 (推薦)
          <span>qrbox: None (演算法全視角抓大碼)</span>
        </button>
        <button class="btn-mode" onclick="switchTestMode('high_fps_full')">
          4️⃣ 滿版 + 15 FPS
          <span>測試高頻滿版是否發燙或掉幀</span>
        </button>
      </div>
    </div>

    <!-- 達成紀錄 -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>🏆 最大尺寸挑戰成果</h2>
        <button onclick="resetRecords()" style="background:none; border:none; color:#ef4444; font-size:0.75rem; cursor:pointer;">重置紀錄</button>
      </div>
      <div class="result-banner">
        <div class="result-title" id="best-record-text">最佳紀錄：尚未記錄，請拿 QR Code 慢慢貼近鏡頭</div>
        <div style="font-size:0.72rem; color:#94a3b8;">
          💡 測試說明：將 QR Code 從遠處慢慢貼近鏡頭，觀察它填滿哪一個顏色框時依然能被掃到！當掃出時，在下方勾選您剛才貼近的等級：
        </div>
        <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
          <button onclick="markLevel('95% 滿版極限', '#ef4444')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;">達標 95% 紅框</button>
          <button onclick="markLevel('80% 超大近拍', '#f97316')" style="background:#f97316; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;">達標 80% 橘框</button>
          <button onclick="markLevel('60% 大碼', '#eab308')" style="background:#eab308; color:#000; border:none; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;">達標 60% 黃框</button>
          <button onclick="markLevel('40% 一般標準', '#22c55e')" style="background:#22c55e; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;">達標 40% 綠框</button>
        </div>
        <div class="result-history" id="record-log"></div>
      </div>
    </div>

  </div>

  <script>
    let html5QrCode = null;
    let currentMode = 'full_frame';
    let audioCtx = null;
    let lastScanText = '';
    let lastScanTime = 0;
    let records = [];

    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);

    window.addEventListener('DOMContentLoaded', async () => {
      await startCamera();
    });

    async function switchTestMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      event?.currentTarget?.classList.add('active');
      await stopCamera();
      await startCamera();
    }

    async function stopCamera() {
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          html5QrCode.clear();
        } catch(e) {}
        html5QrCode = null;
      }
      await new Promise(r => setTimeout(r, 100));
    }

    async function startCamera() {
      let fps = 10;
      let scanConfig = {};

      if (currentMode === 'fixed_180') {
        fps = 10;
        scanConfig = { fps, qrbox: { width: 180, height: 180 } };
      } else if (currentMode === 'fixed_280') {
        fps = 10;
        scanConfig = { fps, qrbox: { width: 280, height: 280 } };
      } else if (currentMode === 'full_frame') {
        fps = 10;
        scanConfig = { fps }; // 沒有 qrbox，全畫面取樣！
      } else if (currentMode === 'high_fps_full') {
        fps = 15;
        scanConfig = { fps }; // 滿版 15fps
      }

      document.getElementById('fps-indicator').textContent = `${fps} FPS · ${currentMode}`;

      html5QrCode = new Html5Qrcode("reader");

      const target = isIos ? { facingMode: "environment" } : { facingMode: "environment" };

      try {
        await html5QrCode.start(target, scanConfig, (text) => {
          onScan(text, currentMode);
        });

        const video = document.querySelector('#reader video');
        if (video) {
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          video.muted = true;
        }
      } catch(err) {
        alert('相機啟動失敗: ' + err);
      }
    }

    function onScan(text, mode) {
      const now = Date.now();
      if (text === lastScanText && (now - lastScanTime) < 800) return;
      lastScanText = text;
      lastScanTime = now;

      // 畫面綠閃
      const flash = document.getElementById('flash');
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 200);

      // 音效
      playBeep(900, 0.08);
      if (navigator.vibrate) navigator.vibrate(60);
    }

    function markLevel(levelName, color) {
      if (!lastScanText) {
        alert('請先在該尺寸下成功掃描一次 QR Code 後再記錄！');
        return;
      }
      const entry = {
        level: levelName,
        mode: currentMode,
        text: lastScanText,
        time: new Date().toLocaleTimeString(),
        color
      };
      records.unshift(entry);
      updateRecordUI();
    }

    function updateRecordUI() {
      if (records.length === 0) return;
      const top = records[0];
      document.getElementById('best-record-text').innerHTML =
        `🎉 最新達標：<span style="color:${top.color}; font-weight:bold;">${top.level}</span> (模式: ${top.mode})`;

      const log = document.getElementById('record-log');
      log.innerHTML = records.map(r => `
        <div style="padding:3px 0; border-bottom:1px solid #1e293b;">
          <span class="badge-record" style="background:${r.color}; color:#fff;">${r.level}</span>
          [${r.time}] 內容: "${r.text.slice(0, 15)}" · 模式: ${r.mode}
        </div>
      `).join('');
    }

    function resetRecords() {
      records = [];
      document.getElementById('best-record-text').textContent = '最佳紀錄：尚未記錄，請拿 QR Code 慢慢貼近鏡頭';
      document.getElementById('record-log').innerHTML = '';
    }

    function playBeep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }
  </script>
</body>
</html>
