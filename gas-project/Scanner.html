<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>班級作業 QR碼 速掃工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作業管理">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    #rotate-hint {
      display: none !important;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.95);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      height: 48px;
      flex-shrink: 0;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title { font-weight: 700; color: var(--accent-blue); font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }

    .nav-btn {
      background: #334155;
      color: #f43f5e;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #475569; color: #fff; }

    /* 統一通用頂部導航按鈕樣式 */
    .header-nav-btn {
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-sizing: border-box;
      letter-spacing: 1px;
    }
    .nav-btn-scan {
      background: rgba(2, 132, 199, 0.12);
      color: #38bdf8;
      border: 1px solid #0284c7;
    }
    .nav-btn-scan:hover, .nav-btn-scan:active {
      background: #0284c7;
      color: #ffffff;
    }
    .nav-btn-check {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .nav-btn-check:hover, .nav-btn-check:active {
      background: #10b981;
      color: #ffffff;
    }
    .nav-btn-check.active {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .nav-btn-cor {
      background: rgba(249, 115, 22, 0.12);
      color: #fb923c;
      border: 1px solid #f97316;
    }
    .nav-btn-cor:hover, .nav-btn-cor:active {
      background: #f97316;
      color: #ffffff;
    }
    .nav-btn-cor.active {
      background: #f97316;
      color: #ffffff;
      border-color: #f97316;
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.4);
    }
    .nav-btn-grade {
      background: rgba(168, 85, 247, 0.12);
      color: #c084fc;
      border: 1px solid #a855f7;
    }
    .nav-btn-grade:hover, .nav-btn-grade:active {
      background: #a855f7;
      color: #ffffff;
    }
    .nav-btn-grade.active {
      background: #a855f7;
      color: #ffffff;
      border-color: #a855f7;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    }
    .nav-btn-pair {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .nav-btn-pair:hover, .nav-btn-pair:active {
      background: #334155;
      color: #ffffff;
      border-color: #64748b;
    }
    .nav-btn-reload {
      background: rgba(250, 204, 21, 0.12);
      color: #facc15;
      border: 1px solid #facc15;
    }
    .nav-btn-reload:hover, .nav-btn-reload:active {
      background: #facc15;
      color: #0f172a;
    }
    .nav-btn-sticker {
      background: rgba(13, 148, 136, 0.12);
      color: #2dd4bf;
      border: 1px solid #0d9488;
    }
    .nav-btn-sticker:hover, .nav-btn-sticker:active {
      background: #0d9488;
      color: #ffffff;
    }

    .header-controls { display: flex; align-items: center; gap: 6px; }
    .btn-icon {
      background: #334155; color: var(--text-main); border: 1px solid #475569;
      padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-icon:active { background: var(--accent-blue); color: #0f172a; }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    .camera-panel {
      flex: 1.1;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: 100%;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #qr-shaded-region {
      display: none !important;
    }

    .viewfinder-box {
      width: min(300px, 75vw, 75vh);
      height: min(300px, 75vw, 75vh);
      border: 3px solid var(--accent-blue);
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(15, 23, 42, 0.65);
      position: relative;
      transition: all 0.2s ease;
    }
    @media (min-width: 768px) {
      .viewfinder-box {
        width: min(380px, 75vw, 75vh);
        height: min(380px, 75vw, 75vh);
      }
    }

    .viewfinder-box::after {
      content: '';
      position: absolute;
      left: 0; right: 0; height: 2px;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
      animation: scan-line 2s ease-in-out infinite alternate;
    }
    @keyframes scan-line {
      0%   { top: 5%; }
      100% { top: 95%; }
    }

    .viewfinder-box.success {
      border-color: var(--accent-green) !important;
      box-shadow: 0 0 0 4000px rgba(34, 197, 94, 0.35), 0 0 30px var(--accent-green) !important;
      background: rgba(34, 197, 94, 0.25) !important;
    }
    .viewfinder-box.duplicate {
      border-color: var(--accent-orange) !important;
      box-shadow: 0 0 0 4000px rgba(249, 115, 22, 0.35), 0 0 30px var(--accent-orange) !important;
      background: rgba(249, 115, 22, 0.25) !important;
    }

    .viewfinder-tip {
      margin-top: 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid #334155;
    }

    .info-panel {
      flex: 0.9;
      background: var(--card-bg);
      border-left: 1px solid #334155;
      padding: 8px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #section-hw-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .selector-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .assign-select {
      flex: 1;
      min-width: 0;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }
    .btn-meta-unit {
      background: #1e293b;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .btn-meta-unit:active, .btn-meta-unit:hover {
      background: var(--accent-blue);
      color: #0f172a;
    }
    .assign-summary { font-size: 0.82rem; font-weight: 700; color: var(--accent-green); white-space: nowrap; }

    .toast-banner {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .toast-banner.success { border-color: var(--accent-green); color: var(--accent-green); background: rgba(34, 197, 94, 0.15); }
    .toast-banner.duplicate { border-color: var(--accent-orange); color: var(--accent-orange); background: rgba(249, 115, 22, 0.15); }
    .toast-banner.error { border-color: var(--accent-red); color: var(--accent-red); background: rgba(239, 68, 68, 0.15); }

    .matrix-title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .matrix-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-text {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    
    .seat-grid-scroll-box {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }

    .seat-pill {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 2px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
    }
    .seat-pill.checked {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    /* 純按鈕清點模式樣式 */
    body.pure-button-mode #rotate-hint {
      display: none !important;
    }
    body.pure-button-mode {
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100dvh;
    }
    body.pure-button-mode .camera-panel {
      display: none !important;
    }
    body.pure-button-mode .app-container {
      flex-direction: column !important;
      height: auto !important;
      overflow-y: auto !important;
    }
    body.pure-button-mode .info-panel {
      flex: 1 !important;
      width: 100% !important;
      max-width: 680px;
      margin: 0 auto;
      border-left: none !important;
      padding: 12px 14px;
    }
    body.pure-button-mode .seat-grid {
      grid-template-columns: repeat(5, 1fr) !important;
      gap: 8px !important;
    }
    body.pure-button-mode .seat-pill {
      padding: 12px 4px !important;
      font-size: 1.05rem !important;
      border-radius: 8px !important;
      min-height: 48px;
    }
    body.pure-button-mode .seat-pill:active {
      transform: scale(0.96);
    }

    /* 📱 直向模式 (Portrait) 自適應：相機在上、燈號在下，永不被黑屏阻擋 */
    @media (orientation: portrait) {
      .app-container {
        flex-direction: column !important;
      }
      .camera-panel {
        flex: none !important;
        height: 38dvh !important;
        width: 100% !important;
      }
      .viewfinder-box {
        width: min(200px, 60vw, 28vh) !important;
        height: min(200px, 60vw, 28vh) !important;
      }
      .viewfinder-tip {
        margin-top: 6px !important;
        padding: 3px 10px !important;
        font-size: 0.72rem !important;
      }
      .info-panel {
        flex: 1 !important;
        width: 100% !important;
        border-left: none !important;
        border-top: 1px solid #334155 !important;
        padding: 6px 8px !important;
        overflow-y: auto !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
      }
      #section-hw-panel {
        flex: 1 !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
      }
      .seat-grid-scroll-box {
        flex: 1 !important;
        min-height: 0 !important;
        overflow-y: auto !important;
      }
      .header-controls {
        gap: 4px !important;
      }
      .header-nav-btn {
        padding: 0 7px !important;
        font-size: 0.78rem !important;
      }
      .header-title {
        font-size: 0.88rem !important;
      }
      .seat-grid {
        gap: 5px !important;
      }
      .seat-pill {
        padding: 6px 2px !important;
        font-size: 0.82rem !important;
      }
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 20px;
      width: 100%; max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-title { font-weight: 700; color: var(--accent-blue); margin-bottom: 12px; font-size: 1.05rem; }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; display: block; }
    .input-txt {
      background: #0f172a; border: 1px solid #475569; color: #fff;
      padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 0.9rem;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-cancel { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: var(--accent-green); color: #000; font-weight: 700; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- PWA 自動更新提示條 (方案1: 背景檢查 + 浮動提示) -->
  <div id="pwa-update-banner" style="display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:999999; background:linear-gradient(135deg, #0284c7, #0369a1); color:#fff; border:1px solid #38bdf8; padding:8px 14px; border-radius:30px; box-shadow:0 8px 24px rgba(0,0,0,0.6); font-size:0.85rem; font-weight:700; align-items:center; gap:8px; white-space:nowrap;">
    <span>✨ 發現系統新版本！</span>
    <button onclick="forcePwaUpdate()" style="background:#22c55e; color:#0f172a; border:none; padding:4px 12px; border-radius:14px; font-weight:700; cursor:pointer; font-size:0.8rem; box-shadow:0 2px 6px rgba(0,0,0,0.3);">立即套用更新</button>
    <button onclick="document.getElementById('pwa-update-banner').style.display='none'" style="background:transparent; color:#cbd5e1; border:none; cursor:pointer; font-size:1.2rem; line-height:1; padding:0 4px;" title="稍後更新">&times;</button>
  </div>

  <div id="unbound-banner" style="display:none; background:linear-gradient(135deg, #f59e0b, #d97706); color:#fff; padding:7px 14px; font-weight:700; font-size:0.82rem; justify-content:space-between; align-items:center; z-index:99999; box-shadow:0 2px 8px rgba(0,0,0,0.3);">
    <span>📱 尚未綁定試算表：請將相機鏡頭對準電腦上的 QR Code 自動綁定！</span>
    <button onclick="promptManualGasUrl()" style="background:#0f172a; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer; font-weight:600; white-space:nowrap; margin-left:8px;">⌨️ 手動輸入網址</button>
  </div>

  <div id="rotate-hint">
    <div class="hint-icon">📱</div>
    <div>請將手機<strong>旋轉成橫向</strong>使用掃碼器</div>
    <div style="font-size:0.85rem; color:#94a3b8;">或點擊下方「加入主畫面」鎖定橫向</div>
  </div>

  <header>
    <div class="header-title-box">
      <div class="header-title">班級作業速掃</div>
    </div>
    <div class="header-controls">
      <button class="header-nav-btn nav-btn-pair" id="btn-pwa-install" style="display:none;" onclick="triggerPwaInstall()">安裝</button>
      <button class="header-nav-btn nav-btn-pair" onclick="switchNextCamera()" title="切換前後鏡頭">鏡頭</button>
      <a href="index.html" id="link-index" class="header-nav-btn nav-btn-check" title="作業清點">清點</a>
      <a href="correction.html" id="link-correction" class="header-nav-btn nav-btn-cor" title="錯題訂正">訂正</a>
      <a href="grading.html" id="link-grading" class="header-nav-btn nav-btn-grade" title="作業批改">批改</a>
      <button class="header-nav-btn nav-btn-pair" onclick="promptManualGasUrl()" title="連線設定">連線</button>
    </div>
  </header>

  <div class="app-container">
    <div class="camera-panel">
      <div id="reader"></div>
      <div class="scanner-overlay">
        <div id="viewfinder" class="viewfinder-box"></div>
        <div id="viewfinder-tip-txt" class="viewfinder-tip">請將作業本右下角 QR碼 置於框內</div>
      </div>
    </div>

    <div class="info-panel">
      <!-- 📥 作業收繳面板 -->
      <div id="section-hw-panel">
        <div class="selector-bar">
          <select id="assign-select" class="assign-select" onchange="onAssignmentChanged()">
            <option value="">(無今日作業，掃碼將自動新增)</option>
          </select>
          <button type="button" class="btn-meta-unit" onclick="openMetaModal()" title="編輯單元與頁數備註">單元...</button>
        </div>

        <div id="toast-banner" class="toast-banner">
          請將手機鏡頭對準作業本右下角 QR碼...
        </div>

        <div class="matrix-title">
          <div class="matrix-title-left">
            <span id="assign-summary" class="assign-summary">已交: 0/-- 人</span>
            <span class="legend-text">(🟢已交 / 🔴未交)</span>
          </div>
          <span id="assign-subnote" style="color:var(--accent-blue); font-weight:600;"></span>
        </div>

        <div class="seat-grid-scroll-box">
          <div id="seat-grid" class="seat-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="meta-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">⚙️ 編輯作業細部說明</div>
      <div class="form-group">
        <label class="form-label">單元／課次</label>
        <input type="text" id="modal-unit" class="input-txt" placeholder="例：2 (輸入數字自動轉第2課/單元)">
      </div>
      <div class="form-group">
        <label class="form-label">頁數／備註</label>
        <input type="text" id="modal-note" class="input-txt" placeholder="例：15-19 或 單元卷/標題">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeMetaModal()">取消</button>
        <button class="btn-save" onclick="saveMetaModal()">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 🔗 連線設定彈窗 -->
  <div id="pair-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 400px;">
      <div class="modal-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>🔗 班級試算表連線設定</span>
        <button onclick="closePairModal()" style="background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer; line-height:1;">&times;</button>
      </div>

function cleanGasUrl(url) {
  if (!url || typeof url !== 'string') return '';
  let clean = url.trim();
  try {
    if (clean.includes('%3A') || clean.includes('%2F')) {
      clean = decodeURIComponent(clean);
    }
  } catch (e) {}
  // 若為純 Deployment ID (如 AKfycby...)
  if (/^AKfy[A-Za-z0-9_-]{40,}$/.test(clean)) {
    return "https://script.google.com/macros/s/".concat(clean, "/exec");
  }
  return clean.replace(/https?:\/\/script\.google\.com\/a\/[^\/]+\//i, 'https://script.google.com/').trim();
}

function getGasApiUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  const paramGasUrl = urlParams.get('api_url') || urlParams.get('gas') || urlParams.get('gas_url') || urlParams.get('gas_id');
  if (paramGasUrl) {
    const clean = cleanGasUrl(paramGasUrl);
    try {localStorage.setItem('class_management_gas_api_url', clean);} catch (e) {}
    return clean;
  }

  if (typeof window._GAS_WEBAPP_URL === 'string' && window._GAS_WEBAPP_URL && window._GAS_WEBAPP_URL.includes('script.google.com')) {
    return cleanGasUrl(window._GAS_WEBAPP_URL);
  }
  if (typeof window.GAS_API_URL === 'string' && window.GAS_API_URL && window.GAS_API_URL.includes('script.google.com')) {
    return cleanGasUrl(window.GAS_API_URL);
  }

  const stored = localStorage.getItem('class_management_gas_api_url') || localStorage.getItem('class_mgmt_gas_api_url');
  if (stored && stored !== 'YOUR_GAS_WEB_APP_URL') {
    return cleanGasUrl(stored);
  }

  if (location.hostname.includes('script.google.com') && !location.hostname.includes('googleusercontent.com')) {
    return cleanGasUrl(location.href.split('?')[0]);
  }

  // 首次使用：若無網址參數且無 localStorage，不跳出阻擋性 prompt，返回空字串並由鏡頭待命掃碼綁定
  return '';
}

// 智能配對偵測：掃描到試算表配對 QR Code 自動綁定
function checkAndHandlePairCode(decodedText) {
  if (!decodedText || typeof decodedText !== 'string') return false;
  const raw = decodedText.trim();
  let matchedUrl = '';

  // 1. 純 Deployment ID (例如 AKfycby...)
  if (/^AKfy[A-Za-z0-9_-]{40,}$/.test(raw)) {
    matchedUrl = "https://script.google.com/macros/s/".concat(raw, "/exec");
  } else if (raw.startsWith('gas:') || raw.startsWith('gas_id:')) {
    const id = raw.replace(/^gas(_id)?:/, '').trim();
    if (/^AKfy[A-Za-z0-9_-]+$/.test(id)) {
      matchedUrl = "https://script.google.com/macros/s/".concat(id, "/exec");
    }
  } else if (raw.includes('api_url=')) {
    try {
      const u = new URL(raw);
      matchedUrl = u.searchParams.get('api_url') || '';
    } catch (e) {
      const m = raw.match(/api_url=([^&]+)/);
      if (m) matchedUrl = decodeURIComponent(m[1]);
    }
  } else if (raw.includes('script.google.com') && raw.includes('/exec')) {
    matchedUrl = raw;
  } else if (raw.includes('gas=') || raw.includes('gas_url=') || raw.includes('gas_id=')) {
    try {
      const u = new URL(raw);
      matchedUrl = u.searchParams.get('gas') || u.searchParams.get('gas_url') || u.searchParams.get('gas_id') || '';
    } catch (e) {}
  }

  if (matchedUrl && matchedUrl.includes('script.google.com') && matchedUrl.includes('/exec')) {
    matchedUrl = cleanGasUrl(matchedUrl);
    if (GAS_API_URL && cleanGasUrl(GAS_API_URL) === matchedUrl) {
      showToast('ℹ️ 已重新連線至此試算表，正在同步資料...', 'info');
      fetchTodayData();
      return true;
    }
    localStorage.setItem('class_management_gas_api_url', matchedUrl);
    localStorage.setItem('class_mgmt_gas_api_url', matchedUrl);
    GAS_API_URL = matchedUrl;
    triggerFeedback('success');
    showToast('🎉 試算表綁定成功！正在連線載入班級資料...', 'success');
    const banner = document.getElementById('unbound-banner');
    if (banner) banner.style.display = 'none';
    setTimeout(() => {
      fetchTodayData();
    }, 500);
    return true;
  }
  return false;
}

// 增強版超穩定 GAS API 呼叫器（支援純 JSONP、自動重試、與 25 秒冷啟動逾時）
async function gasApiFetch(url, retries = 2, timeoutMs = 25000) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await singleGasApiFetch(url, timeoutMs);
    } catch (err) {
      console.warn('[GAS API] 第 ' + (attempt + 1) + ' 次連線失敗: ' + (err ? err.message : ''));
      if (attempt < retries) {
        await new Promise((r) => setTimeout(r, 1200));
      } else {
        throw err;
      }
    }
  }
}

function singleGasApiFetch(url, timeoutMs = 25000) {
  return new Promise((resolve, reject) => {
    const callbackName = 'gas_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const sep = String(url).includes('?') ? '&' : '?';
    const finalUrl = String(url) + sep + 'callback=' + callbackName + '&_t=' + Date.now();
    let isSettled = false;
    let scriptTag = null;

    const timer = setTimeout(() => {
      if (isSettled) return;
      isSettled = true;
      cleanup();
      reject(new Error('伺服器回應較慢 (逾時)，可能是首次冷啟動中，請再試一次'));
    }, timeoutMs);

    function cleanup() {
      try {
        window[callbackName] = function () {};
      } catch (e) {}
      setTimeout(function () {
        try { delete window[callbackName]; } catch (e) {}
      }, 60000);
      if (scriptTag && scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
    }

    window[callbackName] = function (data) {
      if (isSettled) return;
      isSettled = true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    // 直接採用跨域最穩定之 JSONP Script 標籤，不發送多餘 fetch 避免引發伺服器衝突
    scriptTag = document.createElement('script');
    scriptTag.crossOrigin = 'anonymous';
    scriptTag.src = finalUrl;
    scriptTag.onerror = () => {
      if (isSettled) return;
      isSettled = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error('連線失敗 (請確認 GAS 部署「誰可以存取」是否設為「所有人」)'));
    };
    document.head.appendChild(scriptTag);
  });
}

async function gasApi(action, params = {}) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run.
      withSuccessHandler((res) => resolve(res)).
      withFailureHandler((err) => reject(err)).
      handleScannerApiAction(action, params);
    });
  } else {
    const cleanBase = cleanGasUrl(GAS_API_URL);
    const url = new URL(cleanBase);
    url.searchParams.set('action', action);
    for (const [k, v] of Object.entries(params)) {
      url.searchParams.set(k, v);
    }
    return await gasApiFetch(url.toString());
  }
}

function adaptInternalLinks() {
  const isGas = typeof google !== 'undefined' && google.script && google.script.run ||
  location.hostname.includes('script.google.com') ||
  location.hostname.includes('googleusercontent.com');

  if (!isGas) {
    checkIosPwaButton();
    document.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (!href) return;
      const currentApi = typeof GAS_API_URL !== 'undefined' && GAS_API_URL ? GAS_API_URL : localStorage.getItem('class_mgmt_gas_api_url') || '';
      const apiParam = currentApi ? "?api_url=".concat(encodeURIComponent(currentApi)) : '';
      if (href.includes('page=correction') || href === 'correction.html') {
        a.href = "correction.html".concat(apiParam);
      } else if (href.includes('page=index') || href === 'index.html') {
        a.href = "index.html".concat(apiParam);
      } else if (href.includes('page=grading') || href === 'grading.html') {
        a.href = "grading.html".concat(apiParam);
      }
    });
    return;
  }

  function applyGasUrls(baseGasUrl) {
    if (!baseGasUrl || !baseGasUrl.startsWith('https://script.google.com')) return;
    document.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (!href) return;
      if (href === 'scanner.html' || href.includes('page=scanner')) {
        a.href = "".concat(baseGasUrl, "?page=scanner");
        a.target = '_top';
      } else if (href === 'index.html' || href === baseGasUrl || href.endsWith('/exec')) {
        a.href = "".concat(baseGasUrl);
        a.target = '_top';
      } else if (href === 'correction.html' || href.includes('page=correction')) {
        a.href = "".concat(baseGasUrl, "?page=correction");
        a.target = '_top';
      } else if (href === 'correction_scanner.html' || href.includes('page=correction_scanner')) {
        a.href = "".concat(baseGasUrl, "?page=correction_scanner");
        a.target = '_top';
      } else if (href === 'grading.html' || href.includes('page=grading')) {
        a.href = "".concat(baseGasUrl, "?page=grading");
        a.target = '_top';
      } else if (href === 'StickerGenerator.html' || href === 'sticker.html' || href.includes('page=sticker')) {
        a.href = "".concat(baseGasUrl, "?page=sticker");
        a.target = '_top';
      }
    });
  }

  let baseGasUrl = window._GAS_WEBAPP_URL;
  if (!baseGasUrl || !baseGasUrl.startsWith('https://script.google.com')) {
    baseGasUrl = localStorage.getItem('class_mgmt_gas_api_url');
  }
  if ((!baseGasUrl || !baseGasUrl.startsWith('https://script.google.com')) && location.hostname.includes('script.google.com')) {
    baseGasUrl = location.href.split('?')[0];
  }

  if (baseGasUrl && baseGasUrl.startsWith('https://script.google.com')) {
    applyGasUrls(baseGasUrl);
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler((serverUrl) => {
      if (serverUrl && serverUrl.startsWith('https://script.google.com')) {
        window._GAS_WEBAPP_URL = serverUrl;
        localStorage.setItem('class_mgmt_gas_api_url', serverUrl);
        applyGasUrls(serverUrl);
      }
    }).getGasWebAppUrl();
  }
}

function formatUnitDisplay(subject, unit) {
  if (!unit) return '';
  const u = String(unit).trim();
  if (!u) return '';
  if (/^\d+$/.test(u)) {
    return (subject === '國語') ? ('第' + u + '課') : ('第' + u + '單元');
  }
  return u;
}

function formatPageOrNoteDisplay(pageOrNote) {
  if (!pageOrNote) return '';
  const p = String(pageOrNote).trim();
  if (!p) return '';
  if (/^p\.?/i.test(p) || p.includes('頁')) return p;
  if (/^[\d\s\-~～,，、]+$/.test(p) && /\d/.test(p)) return 'p.' + p;
  return p;
}

function renderAssignDropdown() {
  const select = document.getElementById('assign-select');
  select.innerHTML = '';

  if (!scanDataCache.assignments || scanDataCache.assignments.length === 0) {
    const opt = document.createElement('option');
    opt.value = "";
    opt.textContent = "(無今日作業，掃碼將自動新增)";
    select.appendChild(opt);
    currentAssignKey = "";
    return;
  }

  scanDataCache.assignments.forEach((a) => {
    const key = a.key || "".concat(a.subject, "_").concat(a.category);
    const opt = document.createElement('option');
    opt.value = key;
    const uStr = formatUnitDisplay(a.subject, a.unit);
    const detail = uStr || '全班';
    opt.textContent = "".concat(a.subject, " - ").concat(a.category, " (").concat(detail, ")");
    select.appendChild(opt);
  });

  if (!currentAssignKey || !scanDataCache.assignments.some((a) => (a.key || "".concat(a.subject, "_").concat(a.category)) === currentAssignKey)) {
    const latest = scanDataCache.assignments[scanDataCache.assignments.length - 1];
    currentAssignKey = latest.key || "".concat(latest.subject, "_").concat(latest.category);
  }
  select.value = currentAssignKey;
}

function onAssignmentChanged() {
  const select = document.getElementById('assign-select');
  currentAssignKey = select.value;
  renderSeatGrid();
}

function renderSeatGrid() {
  const matrix = scanDataCache.submissionMatrix || {};
  const vacantSeats = scanDataCache.vacantSeats || [];
  const activeTotal = scanDataCache.activeTotal || 30 - vacantSeats.length;

  // Detect API format:
  // Format A (new/expected): matrix[assignKey] = [1, 3, 5, ...] (array of seat numbers)
  // Format B (actual returned): matrix[seatNum] = { assignKey: true/false }
  const firstKey = Object.keys(matrix)[0];
  const isSeatKeyedFormat = firstKey !== undefined && !isNaN(parseInt(firstKey, 10));

  let submittedCount = 0;
  for (let i = 1; i <= 30; i++) {
    const pill = document.getElementById("seat-pill-".concat(i));
    if (!pill) continue;

    // 空號：隱藏燈號
    if (vacantSeats.includes(i)) {
      pill.style.display = 'none';
      continue;
    }
    pill.style.display = '';

    let isSubmitted = false;

    if (isSeatKeyedFormat) {
      const seatObj = matrix[String(i)] || matrix[i];
      isSubmitted = seatObj && currentAssignKey ? seatObj[currentAssignKey] === true : false;
    } else {
      const currentList = currentAssignKey ? matrix[currentAssignKey] || [] : [];
      isSubmitted = Array.isArray(currentList) ? currentList.includes(i) : currentList[i] === true;
    }

    if (isSubmitted) submittedCount++;

    pill.className = "seat-pill ".concat(isSubmitted ? 'checked' : '');
    pill.innerHTML = "<span>".concat(String(i).padStart(2, '0'), "</span><span>").concat(isSubmitted ? '🟢' : '🔴', "</span>");
    pill.onclick = () => toggleSeatSubmission(i);
  }

  document.getElementById('assign-summary').textContent = "已交: ".concat(submittedCount, "/").concat(activeTotal, " 人");

  const currAssignObj = (scanDataCache.assignments || []).find((a) => (a.key || "".concat(a.subject, "_").concat(a.category)) === currentAssignKey);
  if (currAssignObj) {
    const uStr = formatUnitDisplay(currAssignObj.subject, currAssignObj.unit);
    const pStr = formatPageOrNoteDisplay(currAssignObj.note);
    const detailStr = [uStr, pStr].filter(Boolean).join(' ｜ ');
    document.getElementById('assign-subnote').textContent = detailStr ? "📌 ".concat(detailStr) : '';
  } else {
    document.getElementById('assign-subnote').textContent = '';
  }
}

async function toggleSeatSubmission(seatNo) {
  if (!currentAssignKey) {

async function initAndStartCamera(preferTarget = 'environment') {
  const isGas = typeof google !== 'undefined' && google.script && google.script.run ||
  location.hostname.includes('script.google.com') ||
  location.hostname.includes('googleusercontent.com');

  if (isGas) {
    showToast('⚠️ Google 原生網址封鎖相機權限，請切換純按鈕或使用手機 PWA', 'error');
    showGasCameraBlockedNotice();
    return;
  }

  showToast('⏳ 正在啟動高清相機...', 'success');
  await stopActiveCamera();

  // 小幅緩衝 80ms，給予 iOS WebKit / AVCaptureSession 釋放前一鏡頭實例的空間
  await new Promise((r) => setTimeout(r, 80));

  const scanConfig = {
    fps: 10,
    qrbox: (viewfinderWidth, viewfinderHeight) => {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      // 大螢幕 (iPad/平板/PC) 採用 380px，手機採用 280~300px
      // 確保 12字 CMS 碼 (160ms) 與 89x89 超高密度大碼 (116ms) 皆達最優採樣點數
      const edge = minEdge >= 480 ? 380 : Math.max(240, Math.min(300, Math.floor(minEdge * 0.85)));
      return { width: edge, height: edge };
    }
  };

  let startedSuccess = false;
  let target = preferTarget;
  if (target === true) target = 'environment';
  if (target === false) target = 'user';

  try {
    if (availableCameras.length === 0) {
      try {
        const cams = await Html5Qrcode.getCameras();
        if (cams && cams.length > 0) availableCameras = cams;
      } catch (e) {}
    }
    if (availableCameras.length > 0 && (target === 'environment' || target === true)) {
      // 優先找後置主鏡頭（特別針對 iPhone/iPad 多鏡頭，避開 Ultra Wide 超廣角）
      let rearIdx = availableCameras.findIndex((c) =>
      /back.*wide|wide.*back|後置.*廣角/i.test(c.label) && !/ultra|超廣角/i.test(c.label)
      );
      if (rearIdx < 0) {
        rearIdx = availableCameras.findIndex((c) =>
        /back|rear|environment|後|後置|主|標準/i.test(c.label) && !/ultra|超廣角/i.test(c.label)
        );
      }
      if (rearIdx < 0) {
        rearIdx = availableCameras.findIndex((c) =>
        /back|rear|environment|後|後置|主|標準/i.test(c.label)
        );
      }
      const pickIdx = rearIdx >= 0 ? rearIdx : 0;
      currentCameraIndex = pickIdx;
      target = availableCameras[pickIdx].id;
    }

    html5QrCode = new Html5Qrcode("reader", {
      verbose: false,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    });

    // 情況 A：指定 cameraId (由多鏡頭選取)
    if (typeof target === 'string' && target !== 'environment' && target !== 'user') {
      try {
        await html5QrCode.start(target, scanConfig, onScanSuccess);
        startedSuccess = true;
        const camObj = availableCameras.find((c) => c.id === target);
        const label = camObj ? camObj.label || '指定相機' : '相機';
        showToast("🟢 掃碼器就緒 (".concat(label, ")"), 'success');
      } catch (camErr) {
        console.warn('[Camera] 指定 cameraId 啟動失敗，回退至 facingMode 模式:', camErr);
      }
    }

    // 情況 B：啟動後置相機 (螢幕背面)
    if (!startedSuccess && target === 'environment') {
      currentFacingMode = 'environment';
      try {
        await html5QrCode.start({ facingMode: "environment" }, scanConfig, onScanSuccess);
        startedSuccess = true;
        showToast('🟢 掃碼器就緒 (後置相機/螢幕背面)', 'success');
      } catch (envErr) {
        console.warn('[Camera] facingMode environment 啟動失敗:', envErr);
      }
    }

    // 情況 C：啟動前置相機 (螢幕同側)
    if (!startedSuccess && target === 'user') {
      currentFacingMode = 'user';
      try {
        await html5QrCode.start({ facingMode: "user" }, scanConfig, onScanSuccess);
        startedSuccess = true;
        showToast('🟢 掃碼器就緒 (前置相機/螢幕同側)', 'success');
      } catch (userErr) {
        console.warn('[Camera] user facingMode 失敗:', userErr);
      }
    }

    // 情況 D：自動緩衝重試 (處理 iOS 切頁後的短暫硬體衝突)
    if (!startedSuccess) {
      console.warn('[Camera] 首次啟動未成功，等待 500ms 自動重試一次...');
      await new Promise((r) => setTimeout(r, 500));
      try {
        await html5QrCode.start({ facingMode: currentFacingMode }, scanConfig, onScanSuccess);
        startedSuccess = true;
        showToast("🟢 掃碼器就緒 (".concat(currentFacingMode === 'environment' ? '後置相機/螢幕背面' : '前置相機/螢幕同側', ")"), 'success');
      } catch (retryErr) {
        console.warn('[Camera] 重試依然失敗，嘗試枚舉設備:', retryErr);
      }
    }

    // 情況 E：終極回退 (枚舉可用設備)
    if (!startedSuccess) {
      if (availableCameras.length === 0) {
        await refreshCameraListAsync();
      }
      if (availableCameras.length > 0) {
        let pickIdx = 0;
        if (currentFacingMode === 'environment') {
          const rearIdx = availableCameras.findIndex((c) => /back|rear|environment|後|主|標準/i.test(c.label));
          if (rearIdx >= 0) pickIdx = rearIdx;
        } else {
          const frontIdx = availableCameras.findIndex((c) => /front|user|前|自拍|selfie/i.test(c.label));
          if (frontIdx >= 0) pickIdx = frontIdx;
        }
        currentCameraIndex = pickIdx;
        const chosenId = availableCameras[pickIdx].id;
        await html5QrCode.start(chosenId, scanConfig, onScanSuccess);
        startedSuccess = true;
        const label = availableCameras[pickIdx].label || "相機 ".concat(pickIdx + 1);
        showToast("🟢 掃碼器就緒 (".concat(label, ")"), 'success');
      }
    }

    if (startedSuccess) {
      ensureVideoPlayback();
      setupManualFocus();
      refreshCameraListAsync();
    } else {
      showToast('❌ 無法啟動相機，請點擊螢幕重試或檢查相機權限', 'error');
    }

  } catch (err) {
    const isGasCheck = typeof google !== 'undefined' && google.script && google.script.run ||
    location.hostname.includes('script.google.com') ||
    location.hostname.includes('googleusercontent.com');
    if (isGasCheck) {
      showGasCameraBlockedNotice();
    } else {
      showToast('❌ 相機啟動失敗: ' + (err.message || err), 'error');
    }
  }
}

function ensureVideoPlayback() {
  const video = document.querySelector('#reader video');
  if (video) {
    if (!video.hasAttribute('playsinline')) video.setAttribute('playsinline', 'true');
    if (!video.hasAttribute('webkit-playsinline')) video.setAttribute('webkit-playsinline', 'true');
    video.muted = true;
    video.playsInline = true;
    if (video.paused) {
      video.play().catch((e) => console.warn('[Video] auto play error:', e));
    }
  }
}

function setupManualFocus() {
  const cameraBox = document.querySelector('.camera-panel') || document.getElementById('reader');
  if (cameraBox && !cameraBox._hasTapFocus) {
    cameraBox._hasTapFocus = true;
    const doFocusOrRestart = async (e) => {
      try {
        const video = document.querySelector('#reader video');
        const isStalled = !video || !video.srcObject || video.paused || video.readyState < 2 || video.videoWidth === 0;
        if (isStalled) {
          showToast('🔄 偵測到畫面停滯，正在手勢喚醒重啟鏡頭...', 'info');
          await startCameraWithFacingMode(currentFacingMode);
          return;
        }
        ensureVideoPlayback();
        showToast('🎯 鏡頭就緒對焦中', 'info');
      } catch (e) {
        startCameraWithFacingMode(currentFacingMode);
      }
    };
    cameraBox.addEventListener('click', doFocusOrRestart);
    cameraBox.addEventListener('touchend', doFocusOrRestart);
  }
}

async function refreshCameraListAsync() {
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter((d) => d.kind === 'videoinput');
      if (videoDevices.length > 0) {
        availableCameras = videoDevices.map((d) => ({
          id: d.deviceId,
          label: d.label || ''
        }));
        if (currentCameraIndex < 0) {
          if (currentFacingMode === 'environment') {
            let rearIdx = availableCameras.findIndex((c) => /back.*wide|wide.*back|後置.*廣角/i.test(c.label) && !/ultra|超廣角/i.test(c.label));
            if (rearIdx < 0) rearIdx = availableCameras.findIndex((c) => /back|rear|environment|後|後置|主|標準/i.test(c.label) && !/ultra|超廣角/i.test(c.label));
            if (rearIdx < 0) rearIdx = availableCameras.findIndex((c) => /back|rear|environment|後|後置|主|標準/i.test(c.label));
            currentCameraIndex = rearIdx >= 0 ? rearIdx : 0;
          } else {
            const frontIdx = availableCameras.findIndex((c) => /front|user|前|自拍|selfie/i.test(c.label));
            currentCameraIndex = frontIdx >= 0 ? frontIdx : 0;
          }
        }
      }
    }
  } catch (e) {}
}

async function switchNextCamera() {
  showToast('⏳ 正在切換相機鏡頭...', 'info');
  await stopActiveCamera();

  if (availableCameras.length === 0) {
    await refreshCameraListAsync();
  }

  if (availableCameras.length > 1) {
    currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
    const nextCam = availableCameras[currentCameraIndex];
    const label = nextCam.label || "相機 ".concat(currentCameraIndex + 1);
    if (/front|user|前|自拍|selfie/i.test(label)) {
      currentFacingMode = 'user';
    } else {
      currentFacingMode = 'environment';
    }
    showToast("🔄 已切換至：".concat(label), 'success');
    await startCameraWithFacingMode(nextCam.id);
  } else {
    // 若只有 1 個相機或系統未回傳多個 ID，直接切換 facingMode
    currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    const modeLabel = currentFacingMode === 'environment' ? '後置相機 (螢幕背面)' : '前置相機 (螢幕同側)';
    showToast("🔄 已切換至：".concat(modeLabel), 'success');
    await startCameraWithFacingMode(currentFacingMode);
  }
}

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastScannedPayload && now - lastScanTime < 3000) return;
  if (isProcessingScan) return;

  // 優先檢查是否為試算表連線/綁定 QR Code
  if (checkAndHandlePairCode(decodedText)) {
    lastScannedPayload = decodedText;
    lastScanTime = now;
    return;
  }

  if (!GAS_API_URL) {
    showToast('⚠️ 尚未綁定試算表！請先將鏡頭對準電腦上的 QR Code 自動綁定', 'error');
    triggerFeedback('error');
    return;
  }

  isProcessingScan = true;
  lastScannedPayload = decodedText;
  lastScanTime = now;

  showToast("⏳ 掃描到: \"".concat(decodedText, "\" 處理中..."), 'success');

  try {
    const res = await gasApi('doScanRecord', { payload: decodedText });
    const vf = document.getElementById('viewfinder');

    if (res && res.success) {
      if (res.action === 'recorded' || !res.isDuplicate) {
        vf.classList.add('success');
        triggerFeedback('success');
        showToast("🟢 ".concat(res.message), 'success');
        // 自動切換到剛掃到的那筆作業燈號
        if (res.subject && res.category) {
          currentAssignKey = "".concat(res.subject, "_").concat(res.category);
        }
        fetchTodayData();
      } else if (res.action === 'duplicate' || res.isDuplicate) {
        vf.classList.add('duplicate');
        triggerFeedback('duplicate');
        showToast("🟧 ".concat(res.message), 'duplicate');
        // 重複掃碼也切換到該作業，讓教師確認
        if (res.subject && res.category) {
          currentAssignKey = "".concat(res.subject, "_").concat(res.category);
        }
        fetchTodayData();
      } else {
        showToast("ℹ️ ".concat(res.message), 'success');
      }
    } else {
      triggerFeedback('error');
      showToast("❌ 登記失敗: ".concat(res ? res.message : ''), 'error');
    }

    setTimeout(() => {
      vf.className = 'viewfinder-box';
    }, 1500);

  } catch (err) {
    triggerFeedback('error');
    showToast('❌ 網路請求失敗，請檢查連線', 'error');
  } finally {
    setTimeout(() => {isProcessingScan = false;}, 1200);
  }
}

function openMetaModal() {
  if (!currentAssignKey) {
    showToast('⚠️ 目前尚無選取的作業可編輯細節', 'error');
    return;
  }
  const curr = (scanDataCache.assignments || []).find((a) => a.key === currentAssignKey);
  document.getElementById('modal-unit').value = curr ? curr.unit || '' : '';
  document.getElementById('modal-note').value = curr ? curr.note || '' : '';
  document.getElementById('meta-modal').classList.remove('hidden');
}

function closeMetaModal() {
  document.getElementById('meta-modal').classList.add('hidden');
}

async function saveMetaModal() {
  if (!currentAssignKey) return;
  const curr = (scanDataCache.assignments || []).find((a) => a.key === currentAssignKey);
  if (!curr) return;

  const unitVal = document.getElementById('modal-unit').value.trim();
  const noteVal = document.getElementById('modal-note').value.trim();

  showToast('⏳ 正在儲存作業說明...', 'success');
  try {
    const res = await gasApi('updateHomeworkMetadata', {
      colIndex: curr.colIndex,
      unit: unitVal,
      note: noteVal
    });
    if (res && res.success) {
      showToast('🟢 作業說明更新成功！', 'success');
      closeMetaModal();
      fetchTodayData();
    } else {
      showToast('❌ 更新失敗: ' + (res ? res.message : ''), 'error');
    }
  } catch (err) {
    showToast('❌ 系統連線異常', 'error');
  }
}
</script>
</body>
</html>
