<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>📱 班級作業 QR碼 速掃工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作業管理">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script>window._GAS_WEBAPP_URL = "<?= (typeof _GAS_WEBAPP_URL !== 'undefined') ? _GAS_WEBAPP_URL : '' ?>";</script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    #rotate-hint {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #0f172a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1.2rem;
      color: #38bdf8;
      font-weight: 700;
      text-align: center;
      padding: 24px;
    }
    #rotate-hint .hint-icon { font-size: 3rem; animation: spin90 1.2s ease-in-out infinite alternate; }
    @keyframes spin90 {
      from { transform: rotate(0deg); }
      to   { transform: rotate(90deg); }
    }
    @media (orientation: portrait) {
      #rotate-hint { display: flex; }
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.95);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      height: 48px;
      flex-shrink: 0;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title { font-weight: 700; color: var(--accent-blue); font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }

    .nav-btn {
      background: #334155;
      color: #f43f5e;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #475569; color: #fff; }

    .header-controls { display: flex; align-items: center; gap: 6px; }
    .btn-icon {
      background: #334155; color: var(--text-main); border: 1px solid #475569;
      padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-icon:active { background: var(--accent-blue); color: #0f172a; }

    .app-container {
      flex: 1;
      display: flex;
      flex-direction: row !important;
      overflow: hidden;
    }

    .camera-panel {
      flex: 1.1;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .scanner-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .viewfinder-box {
      width: 190px;
      height: 190px;
      border: 3px solid var(--accent-blue);
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(15, 23, 42, 0.65);
      position: relative;
      transition: all 0.2s ease;
    }

    .viewfinder-box::after {
      content: '';
      position: absolute;
      left: 0; right: 0; height: 2px;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
      animation: scan-line 2s ease-in-out infinite alternate;
    }
    @keyframes scan-line {
      0%   { top: 5%; }
      100% { top: 95%; }
    }

    .viewfinder-box.success {
      border-color: var(--accent-green) !important;
      box-shadow: 0 0 0 4000px rgba(34, 197, 94, 0.35), 0 0 30px var(--accent-green) !important;
      background: rgba(34, 197, 94, 0.25) !important;
    }
    .viewfinder-box.duplicate {
      border-color: var(--accent-orange) !important;
      box-shadow: 0 0 0 4000px rgba(249, 115, 22, 0.35), 0 0 30px var(--accent-orange) !important;
      background: rgba(249, 115, 22, 0.25) !important;
    }

    .viewfinder-tip {
      margin-top: 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid #334155;
    }

    .info-panel {
      flex: 0.9;
      background: var(--card-bg);
      border-left: 1px solid #334155;
      padding: 8px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #section-hw-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .selector-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .assign-select {
      flex: 1;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }
    .assign-summary { font-size: 0.8rem; font-weight: 700; color: var(--accent-green); white-space: nowrap; }

    .toast-banner {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .toast-banner.success { border-color: var(--accent-green); color: var(--accent-green); background: rgba(34, 197, 94, 0.15); }
    .toast-banner.duplicate { border-color: var(--accent-orange); color: var(--accent-orange); background: rgba(249, 115, 22, 0.15); }
    .toast-banner.error { border-color: var(--accent-red); color: var(--accent-red); background: rgba(239, 68, 68, 0.15); }

    .matrix-title { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    
    .seat-grid-scroll-box {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }

    .seat-pill {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 2px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
    }
    .seat-pill.checked {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    /* 純按鈕清點模式樣式 */
    body.pure-button-mode #rotate-hint {
      display: none !important;
    }
    body.pure-button-mode {
      overflow-y: auto !important;
      height: auto !important;
      min-height: 100dvh;
    }
    body.pure-button-mode .camera-panel {
      display: none !important;
    }
    body.pure-button-mode .app-container {
      flex-direction: column !important;
      height: auto !important;
      overflow-y: auto !important;
    }
    body.pure-button-mode .info-panel {
      flex: 1 !important;
      width: 100% !important;
      max-width: 680px;
      margin: 0 auto;
      border-left: none !important;
      padding: 12px 14px;
    }
    body.pure-button-mode .seat-grid {
      grid-template-columns: repeat(5, 1fr) !important;
      gap: 8px !important;
    }
    body.pure-button-mode .seat-pill {
      padding: 12px 4px !important;
      font-size: 1.05rem !important;
      border-radius: 8px !important;
      min-height: 48px;
    }
    body.pure-button-mode .seat-pill:active {
      transform: scale(0.96);
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 20px;
      width: 100%; max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-title { font-weight: 700; color: var(--accent-blue); margin-bottom: 12px; font-size: 1.05rem; }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; display: block; }
    .input-txt {
      background: #0f172a; border: 1px solid #475569; color: #fff;
      padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 0.9rem;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-cancel { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: var(--accent-green); color: #000; font-weight: 700; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- PWA 自動更新提示條 (方案1: 背景檢查 + 浮動提示) -->
  <div id="pwa-update-banner" style="display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:999999; background:linear-gradient(135deg, #0284c7, #0369a1); color:#fff; border:1px solid #38bdf8; padding:8px 14px; border-radius:30px; box-shadow:0 8px 24px rgba(0,0,0,0.6); font-size:0.85rem; font-weight:700; align-items:center; gap:8px; white-space:nowrap;">
    <span>✨ 發現系統新版本！</span>
    <button onclick="window.location.reload()" style="background:#22c55e; color:#0f172a; border:none; padding:4px 12px; border-radius:14px; font-weight:700; cursor:pointer; font-size:0.8rem; box-shadow:0 2px 6px rgba(0,0,0,0.3);">立即套用更新</button>
    <button onclick="document.getElementById('pwa-update-banner').style.display='none'" style="background:transparent; color:#cbd5e1; border:none; cursor:pointer; font-size:1.2rem; line-height:1; padding:0 4px;" title="稍後更新">&times;</button>
  </div>

  <div id="rotate-hint">
    <div class="hint-icon">📱</div>
    <div>請將手機<strong>旋轉成橫向</strong>使用掃碼器</div>
    <div style="font-size:0.85rem; color:#94a3b8;">或點擊下方「加入主畫面」鎖定橫向</div>
  </div>

  <header>
    <div class="header-title-box">
      <div class="header-title">📱 班級作業 QR碼 速掃工具</div>
      <a href="correction_scanner.html" class="nav-btn" style="color:#38bdf8;">📱 訂正掃碼</a>
      <a href="correction.html" class="nav-btn">✏ 錯題主頁</a>
    </div>
    <div class="header-controls">
      <button class="btn-icon" id="btn-pwa-install" style="display:none; background:#0284c7; color:#fff; border-color:#38bdf8;" onclick="triggerPwaInstall()">📲 安裝App</button>
      <a href="index.html" class="btn-icon" id="btn-mode-toggle" style="background:#0284c7; color:#fff; border-color:#38bdf8; text-decoration:none;">🎯 純按鈕清點</a>
      <button class="btn-icon" onclick="switchNextCamera()">🔄 切換鏡頭</button>
      <button class="btn-icon" onclick="openMetaModal()"> 細節</button>
    </div>
  </header>

  <div class="app-container">
    <div class="camera-panel">
      <div id="reader"></div>
      <div class="scanner-overlay">
        <div id="viewfinder" class="viewfinder-box"></div>
        <div id="viewfinder-tip-txt" class="viewfinder-tip">🎯 請將作業本右上角 QR碼 置於框內</div>
      </div>
    </div>

    <div class="info-panel">
      <!-- 📥 作業收繳面板 -->
      <div id="section-hw-panel">
        <div class="selector-bar">
          <select id="assign-select" class="assign-select" onchange="onAssignmentChanged()">
            <option value="">(無今日作業，掃碼將自動新增)</option>
          </select>
          <div id="assign-summary" class="assign-summary">已交: 0/-- 人</div>
        </div>

        <div id="toast-banner" class="toast-banner">
          請將手機鏡頭對準作業本右上角 QR碼...
        </div>

        <div class="matrix-title">
          <span>全班 30 人收繳燈號 (🟢已交 / 🔴未交)</span>
          <span id="assign-subnote" style="color:var(--accent-blue);"></span>
        </div>

        <div class="seat-grid-scroll-box">
          <div id="seat-grid" class="seat-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="meta-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title"> 編輯作業細部說明</div>
      <div class="form-group">
        <label class="form-label">單元</label>
        <input type="text" id="modal-unit" class="input-txt" placeholder="例：第一課 或 第1單元">
      </div>
      <div class="form-group">
        <label class="form-label">頁數 / 備註</label>
        <input type="text" id="modal-note" class="input-txt" placeholder="例：P.10~15 或 帶簽名">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeMetaModal()">取消</button>
        <button class="btn-save" onclick="saveMetaModal()">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    // ── PWA Service Worker 註冊、自動更新偵測與安裝提示 ──
    let deferredInstallPrompt = null;
    const hadPriorController = ('serviceWorker' in navigator) && !!navigator.serviceWorker.controller;

    function showPwaUpdateBanner() {
      const banner = document.getElementById('pwa-update-banner');
      if (banner) {
        banner.style.display = 'flex';
      }
    }

    if ('serviceWorker' in navigator) {
      // 監聽 Controller 變化：當有舊的 SW 且新 SW 接管時，觸發新版本提示
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadPriorController) {
          showPwaUpdateBanner();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          .then(reg => {
            // 1. 定期與切換前台時主動向伺服器檢查新版本
            reg.update().catch(() => {});
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update().catch(() => {});
              }
            });
            setInterval(() => {
              reg.update().catch(() => {});
            }, 10 * 60 * 1000); // 每 10 分鐘背景檢查一次

            // 2. 監聽更新事件
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showPwaUpdateBanner();
                }
              });
            });
          })
          .catch(err => console.log('SW note:', err));
      });
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('btn-pwa-install');
      if (btn) btn.style.display = 'inline-flex';
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      const btn = document.getElementById('btn-pwa-install');
      if (btn) btn.style.display = 'none';
      console.log('PWA 已成功安裝至主畫面');
    });
    function showIosInstallModal() {
      let modal = document.getElementById('ios-pwa-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'ios-pwa-modal';
        modal.className = 'modal-overlay';
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.85); display:flex; align-items:center; justify-content:center; z-index:999999; backdrop-filter:blur(4px); padding:16px;';
        modal.innerHTML = `
          <div style="background:#1e293b; border:1px solid #38bdf8; border-radius:16px; max-width:400px; width:100%; padding:22px; box-shadow:0 12px 36px rgba(0,0,0,0.6); text-align:center;">
            <div style="font-size:2.6rem; margin-bottom:10px;">📲🍎</div>
            <h3 style="color:#f8fafc; font-size:1.15rem; font-weight:800; margin-bottom:12px;">iPhone / iPad 加入主畫面教學</h3>
            <div style="color:#cbd5e1; font-size:0.86rem; line-height:1.7; text-align:left; background:#0f172a; padding:14px; border-radius:10px; border:1px solid #334155; margin-bottom:16px;">
              <div>1. 請確認是在 <strong>Safari</strong> 瀏覽器中開啟本頁面</div>
              <div>2. 點擊 Safari 底部工具列中間的 <strong>「分享」圖示</strong>（📤 方塊向上箭頭）</div>
              <div>3. 在選單中往下滑動，找到並點選 <strong>「加入主畫面」</strong>（➕）</div>
              <div>4. 點擊右上角 <strong>「新增」</strong> 即可在手機桌面建立全螢幕 App！</div>
            </div>
            <button onclick="document.getElementById('ios-pwa-modal').style.display='none'" style="background:#0284c7; color:#fff; border:none; padding:9px 24px; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.9rem;">我知道了</button>
          </div>
        `;
        document.body.appendChild(modal);
      } else {
        modal.style.display = 'flex';
      }
    }

    function isIosOrIpad() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
             (navigator.userAgent.includes('Macintosh') && navigator.maxTouchPoints > 1);
    }

    function checkIosPwaButton() {
      const isIos = isIosOrIpad();
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      if (isIos && !isStandalone) {
        const btn = document.getElementById('btn-pwa-install');
        if (btn) btn.style.display = 'inline-flex';
      }
    }

    function triggerPwaInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(() => {
          deferredInstallPrompt = null;
          const btn = document.getElementById('btn-pwa-install');
          if (btn) btn.style.display = 'none';
        });
      } else {
        if (isIosOrIpad()) {
          showIosInstallModal();
        }
      }
    }

    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    function getGasApiUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const paramGasUrl = urlParams.get('api_url') || urlParams.get('gas') || urlParams.get('gas_url');
      if (paramGasUrl) {
        try {
          localStorage.setItem('class_management_gas_api_url', paramGasUrl);
          localStorage.setItem('class_mgmt_gas_api_url', paramGasUrl);
        } catch(e){}
        return paramGasUrl;
      }

      if (typeof window._GAS_WEBAPP_URL === 'string' && window._GAS_WEBAPP_URL && window._GAS_WEBAPP_URL.startsWith('https://script.google.com')) {
        return window._GAS_WEBAPP_URL;
      }

      const stored = localStorage.getItem('class_management_gas_api_url') || localStorage.getItem('class_mgmt_gas_api_url');
      if (stored && stored !== 'YOUR_GAS_WEB_APP_URL') {
        return stored;
      }

      if (window.GAS_API_URL && window.GAS_API_URL !== 'YOUR_GAS_WEB_APP_URL') {
        return window.GAS_API_URL;
      }

      if (location.hostname.includes('script.google.com') && !location.hostname.includes('googleusercontent.com')) {
        return location.href.split('?')[0];
      }

      return '';
    }

    let pairScannerObj = null;

    function showPairSetupModal() {
      let modal = document.getElementById('pair-setup-modal');
      if (modal) {
        modal.style.display = 'flex';
        return;
      }
      modal = document.createElement('div');
      modal.id = 'pair-setup-modal';
      modal.className = 'modal-overlay';
      modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.92); display:flex; align-items:center; justify-content:center; z-index:999999; backdrop-filter:blur(6px); padding:16px;';
      modal.innerHTML = `
        <div style="background:#1e293b; border:1px solid #38bdf8; border-radius:18px; max-width:440px; width:100%; padding:22px; box-shadow:0 16px 40px rgba(0,0,0,0.7); text-align:center; color:#f8fafc;">

    function handleScannedPairUrl(decodedText) {

      } else if (decodedText.startsWith('https://script.google.com')) {
        gasUrl = decodedText.trim();
      }

      if (gasUrl && gasUrl.startsWith('https://script.google.com')) {
        if (pairScannerObj) {
          pairScannerObj.stop().catch(() => {});

        localStorage.setItem('class_management_gas_api_url', gasUrl);
        localStorage.setItem('class_mgmt_gas_api_url', gasUrl);
        alert('🎉 配對成功！已自動綁定班級試算表，即將進入系統！');
        const pure = window.location.href.split('?')[0];
        window.location.href = `${pure}?api_url=${encodeURIComponent(gasUrl)}`;

    function updateDynamicManifest(gasApiUrl) {
      if (!gasApiUrl || !gasApiUrl.startsWith('https://script.google.com')) return;
      const manifestLink = document.querySelector('link[rel="manifest"]');
      if (!manifestLink) return;

      const currentPath = window.location.pathname.split('/').pop() || 'scanner.html';
      const startUrl = `./${currentPath}?api_url=${encodeURIComponent(gasApiUrl)}`;

      fetch(manifestLink.href)
        .then(res => res.json())
        .then(data => {
          data.start_url = startUrl;
          if (Array.isArray(data.shortcuts)) {
            data.shortcuts = data.shortcuts.map(s => {
              const pure = s.url.split('?')[0];
              return { ...s, url: `${pure}?api_url=${encodeURIComponent(gasApiUrl)}` };
            });
          }
          const blob = new Blob([JSON.stringify(data)], { type: 'application/manifest+json' });
          manifestLink.href = URL.createObjectURL(blob);
        })
        .catch(() => {});
    }

    const GAS_API_URL = getGasApiUrl();

    // 增強版超穩定 GAS API 呼叫器（支援 fetch 優先、JSONP 備援、自動重試、與 18 秒冷啟動逾時）
    async function gasApiFetch(url, retries = 2, timeoutMs = 18000) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          return await singleGasApiFetch(url, timeoutMs);
        } catch (err) {
          console.warn(`[GAS API] 第 ${attempt + 1} 次連線失敗: ${err.message}`);
          if (attempt < retries) {
            await new Promise(r => setTimeout(r, 1000));
          } else {
            throw err;
          }
        }
      }
    }

    function singleGasApiFetch(url, timeoutMs = 18000) {
      return new Promise((resolve, reject) => {
        const cleanUrl = String(url).replace(/\/a\/macros\/[a-zA-Z0-9.-]+\//, '/');
        const callbackName = 'gas_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const sep = cleanUrl.includes('?') ? '&' : '?';
        const finalUrl = cleanUrl + sep + 'callback=' + callbackName + '&_t=' + Date.now();

        let isSettled = false;
        let scriptTag = null;

        const timeoutTimer = setTimeout(() => {
          if (isSettled) return;
          isSettled = true;
          cleanup();
          reject(new Error('伺服器回應較慢 (逾時)'));
        }, timeoutMs);

        function cleanup() {
          delete window[callbackName];
          if (scriptTag && scriptTag.parentNode) {
            scriptTag.parentNode.removeChild(scriptTag);
          }
        }

        window[callbackName] = function(data) {
          if (isSettled) return;
          isSettled = true;
          clearTimeout(timeoutTimer);
          cleanup();
          resolve(data);
        };

        fetch(finalUrl, { method: 'GET', redirect: 'follow' })
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(text => {
            if (isSettled) return;
            let parsedData = null;
            if (text.startsWith(callbackName + '(') && text.endsWith(')')) {
              const jsonStr = text.substring(callbackName.length + 1, text.length - 1);
              parsedData = JSON.parse(jsonStr);
            } else if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
              parsedData = JSON.parse(text);
            }
            if (parsedData) {
              isSettled = true;
              clearTimeout(timeoutTimer);
              cleanup();
              resolve(parsedData);
            }
          })
          .catch(() => {
            if (isSettled) return;
            scriptTag = document.createElement('script');
            scriptTag.src = finalUrl;
            scriptTag.onerror = function() {
              if (isSettled) return;
              isSettled = true;
              clearTimeout(timeoutTimer);
              cleanup();
              reject(new Error('網路連線失敗'));
            };
            document.head.appendChild(scriptTag);
          });
      });
    }

    async function gasApi(action, params = {}) {
      const cleanBase = GAS_API_URL.replace(/\/a\/macros\/[a-zA-Z0-9.-]+\//, '/');
      const url = new URL(cleanBase);
      url.searchParams.set('action', action);
      for (const [k, v] of Object.entries(params)) {
        url.searchParams.set(k, v);
      }
      return await gasApiFetch(url.toString());
    }

    function adaptInternalLinks() {
      const isGas = (typeof google !== 'undefined' && google.script && google.script.run) ||
                    location.hostname.includes('script.google.com') ||
                    location.hostname.includes('googleusercontent.com');

      if (!isGas) {
        // 在外部空間 (Neocities / 手機 PWA)：將 GAS API 網址自動帶入所有內部頁面連結中，確保換頁時永遠不用重新設定或跳彈窗！
        if (GAS_API_URL && GAS_API_URL.startsWith('https://script.google.com')) {
          const encApi = encodeURIComponent(GAS_API_URL);
          const targetPages = ['scanner.html', 'index.html', 'correction.html', 'correction_scanner.html', 'StickerGenerator.html'];
          document.querySelectorAll('a[href]').forEach(a => {
            const href = a.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
            const purePage = href.split('?')[0];
            if (targetPages.includes(purePage)) {
              a.href = `${purePage}?api_url=${encApi}`;
            }
          });
        }
        return;
      }

      function applyGasUrls(baseGasUrl) {
        if (!baseGasUrl || !baseGasUrl.startsWith('https://script.google.com')) return;
        document.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href');
          if (!href) return;
          if (href === 'scanner.html' || href.includes('page=scanner')) {
            a.href = `${baseGasUrl}?page=scanner`;
            a.target = '_top';
          } else if (href === 'index.html' || href === baseGasUrl || href.endsWith('/exec')) {
            a.href = `${baseGasUrl}`;
            a.target = '_top';
          } else if (href === 'correction.html' || href.includes('page=correction')) {
            a.href = `${baseGasUrl}?page=correction`;
            a.target = '_top';
          } else if (href === 'correction_scanner.html' || href.includes('page=correction_scanner')) {
            a.href = `${baseGasUrl}?page=correction_scanner`;
            a.target = '_top';
          } else if (href === 'StickerGenerator.html' || href === 'sticker.html' || href.includes('page=sticker')) {
            a.href = `${baseGasUrl}?page=sticker`;
            a.target = '_top';
          }
        });
      }

      let baseGasUrl = window._GAS_WEBAPP_URL;
      if (!baseGasUrl || !baseGasUrl.startsWith('https://script.google.com')) {
        baseGasUrl = localStorage.getItem('class_mgmt_gas_api_url') || localStorage.getItem('class_management_gas_api_url');
      }
      if ((!baseGasUrl || !baseGasUrl.startsWith('https://script.google.com')) && location.hostname.includes('script.google.com')) {
        baseGasUrl = location.href.split('?')[0];
      }

      if (baseGasUrl && baseGasUrl.startsWith('https://script.google.com')) {
        applyGasUrls(baseGasUrl);
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(serverUrl => {
          if (serverUrl && serverUrl.startsWith('https://script.google.com')) {
            window._GAS_WEBAPP_URL = serverUrl;
            localStorage.setItem('class_mgmt_gas_api_url', serverUrl);
            localStorage.setItem('class_management_gas_api_url', serverUrl);
            applyGasUrls(serverUrl);
          }
        }).getGasWebAppUrl();
      }
    }

    // iOS PWA 獨立視窗保活：攔截同源 a 標籤點擊，改以 window.location.href 導航，避免跳出 PWA 進入 Safari
    if (window.navigator.standalone === true) {
      document.addEventListener('click', function(e) {
        const a = e.target.closest('a');
        if (!a) return;
        const href = a.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('javascript:') || a.target === '_blank') return;
        if (!href.startsWith('http://') && !href.startsWith('https://') || href.startsWith(window.location.origin)) {
          e.preventDefault();
          window.location.href = a.href;
        }
      }, false);
    }

    async function fetchTodayData() {
      try {
        showToast('⏳ 正在同步試算表收繳狀態...', 'success');

        if (res && (res.success || res.todayStr)) {

    function renderAssignDropdown() {
      const select = document.getElementById('assign-select');
      select.innerHTML = '';

      if (!scanDataCache.assignments || scanDataCache.assignments.length === 0) {
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "(無今日作業，掃碼將自動新增)";
        select.appendChild(opt);
        currentAssignKey = "";
        return;
      }

      scanDataCache.assignments.forEach(a => {
        const key = a.key || `${a.subject}_${a.category}`;
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = `${a.subject} - ${a.category} (${a.unit || '全班'})`;
        select.appendChild(opt);
      });

      if (!currentAssignKey || !scanDataCache.assignments.some(a => (a.key || `${a.subject}_${a.category}`) === currentAssignKey)) {
        const latest = scanDataCache.assignments[scanDataCache.assignments.length - 1];
        currentAssignKey = latest.key || `${latest.subject}_${latest.category}`;
      }
      select.value = currentAssignKey;
    }

    function onAssignmentChanged() {
      const select = document.getElementById('assign-select');
      currentAssignKey = select.value;
      renderSeatGrid();
    }

    function renderSeatGrid() {
      const matrix = scanDataCache.submissionMatrix || {};
      const vacantSeats = scanDataCache.vacantSeats || [];
      const activeTotal = scanDataCache.activeTotal || (30 - vacantSeats.length);

      // Detect API format:
      // Format A (new/expected): matrix[assignKey] = [1, 3, 5, ...] (array of seat numbers)
      // Format B (actual returned): matrix[seatNum] = { assignKey: true/false }
      const firstKey = Object.keys(matrix)[0];
      const isSeatKeyedFormat = firstKey !== undefined && !isNaN(parseInt(firstKey, 10));

      let submittedCount = 0;
      for (let i = 1; i <= 30; i++) {
        const pill = document.getElementById(`seat-pill-${i}`);
        if (!pill) continue;

        // 空號：隱藏燈號
        if (vacantSeats.includes(i)) {
          pill.style.display = 'none';
          continue;
        }
        pill.style.display = '';

        let isSubmitted = false;

        if (isSeatKeyedFormat) {
          const seatObj = matrix[String(i)] || matrix[i];
          isSubmitted = seatObj && currentAssignKey ? (seatObj[currentAssignKey] === true) : false;
        } else {
          const currentList = currentAssignKey ? (matrix[currentAssignKey] || []) : [];
          isSubmitted = Array.isArray(currentList) ? currentList.includes(i) : (currentList[i] === true);
        }

        if (isSubmitted) submittedCount++;

        pill.className = `seat-pill ${isSubmitted ? 'checked' : ''}`;
        pill.innerHTML = `<span>${String(i).padStart(2, '0')}</span><span>${isSubmitted ? '🟢' : '🔴'}</span>`;
        pill.onclick = () => toggleSeatSubmission(i);
      }

      document.getElementById('assign-summary').textContent = `已交: ${submittedCount}/${activeTotal} 人`;

      const currAssignObj = (scanDataCache.assignments || []).find(a => (a.key || `${a.subject}_${a.category}`) === currentAssignKey);
      if (currAssignObj) {
        const detailStr = [currAssignObj.unit, currAssignObj.note].filter(Boolean).join(' | ');
        document.getElementById('assign-subnote').textContent = detailStr ? `📌 ${detailStr}` : '';
      } else {
        document.getElementById('assign-subnote').textContent = '';
      }
    }

    async function toggleSeatSubmission(seatNo) {
      if (!currentAssignKey) {
        showToast(' 請先選擇作業項目', 'error');
        return;
      }
      const curr = (scanDataCache.assignments || []).find(a => (a.key || `${a.subject}_${a.category}`) === currentAssignKey);
      showToast(`⏳ 正在切換 ${seatNo}號 的繳交狀態...`, 'success');
      try {
        const res = await gasApi('toggleManualSubmission', {
          seatNo: seatNo,
          assignKey: currentAssignKey,
          colIndex: curr ? curr.colIndex : ''
        });
        if (res && res.success) {
          triggerFeedback('success');
          showToast(res.message || `🟢 已更新 ${seatNo}號 狀態`, 'success');
          fetchTodayData();
        } else {
          showToast(`❌ 更新失敗: ${res ? res.message : ''}`, 'error');
        }
      } catch (err) {
        showToast('❌ 網絡連線異常', 'error');
      }
    }

              因 Google Apps Script 官方安全沙箱限制，凡透過 <code>script.google.com</code> 原生網址開啟之頁面均無法授權調用瀏覽器相機（<code>getUserMedia</code>）。<br><br>
              👉 <strong>建議使用方式：</strong><br>
              1. 點擊下方<strong>「🎯 切換純按鈕清點」</strong>，直接在電腦大螢幕快速按鈕點收。<br>
              2. 如需手機相機極速掃碼，請改用手機開啟 <strong>Neocities 外部託管網址</strong> 或手機安裝之 <strong>PWA App</strong>！
            </p>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
              <a href="${baseGasUrl || 'index.html'}" class="nav-btn" style="background:#0284c7; color:#fff; text-decoration:none; padding:8px 18px; border-radius:8px; font-weight:700; font-size:0.9rem;" target="_top">🎯 切換純按鈕清點</a>
              <button onclick="document.getElementById('gas-camera-modal').style.display='none'" style="background:#334155; color:#cbd5e1; border:1px solid #475569; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; font-size:0.85rem;">我知道了</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
      } else {
        modal.style.display = 'flex';
      }
    }

    async function initAndStartCamera(preferRear = true) {
      const isGas = (typeof google !== 'undefined' && google.script && google.script.run) ||
                    location.hostname.includes('script.google.com') ||
                    location.hostname.includes('googleusercontent.com');

      if (isGas) {
        showToast(' Google 原生網址封鎖相機權限，請切換純按鈕或使用手機 PWA', 'error');
        showGasCameraBlockedNotice();
        return;
      }

      showToast('⏳ 正在啟動相機...', 'success');

      const config = { fps: 10, qrbox: { width: 180, height: 180 } };

      try {
        // 枚舉所有相機（最可靠的方式）
        if (availableCameras.length === 0) {
          availableCameras = await Html5Qrcode.getCameras();
        }

        if (!availableCameras || availableCameras.length === 0) {
          showToast('❌ 找不到任何相機', 'error');
          return;
        }

        // 選相機：優先找後置（label 含 back/rear/environment/後/後置）
        if (preferRear) {
          const rearIdx = availableCameras.findIndex(c =>
            /back|rear|environment|後|後置/i.test(c.label)
          );
          currentCameraIndex = rearIdx >= 0 ? rearIdx : availableCameras.length - 1;
        }

        const cameraId = availableCameras[currentCameraIndex].id;
        html5QrCode = new Html5Qrcode("reader");

        await html5QrCode.start(cameraId, config, onScanSuccess);
        const label = availableCameras[currentCameraIndex].label || `相機 ${currentCameraIndex + 1}`;
        showToast(`🟢 掃碼器就緒 (${label})`, 'success');

      } catch (err) {
        const isGasCheck = (typeof google !== 'undefined' && google.script && google.script.run) ||
                           location.hostname.includes('script.google.com') ||
                           location.hostname.includes('googleusercontent.com');
        if (isGasCheck) {
          showGasCameraBlockedNotice();
        } else {
          showToast('❌ 相機啟動失敗: ' + err, 'error');
        }
      }
    }

    function switchNextCamera() {
      if (availableCameras.length <= 1) {
        showToast(' 本裝置只有一個相機', 'error');
        return;
      }
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      const label = availableCameras[currentCameraIndex].label || `相機 ${currentCameraIndex + 1}`;
      showToast(`🔄 切換到: ${label}`, 'success');
      startCameraWithFacingMode(false); // false = 不重設偏好，直接用 currentCameraIndex
    }

    async function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastScannedPayload && (now - lastScanTime) < 3000) return;
      if (isProcessingScan) return;

      isProcessingScan = true;
      lastScannedPayload = decodedText;
      lastScanTime = now;

      showToast(`⏳ 掃描到: "${decodedText}" 處理中...`, 'success');

      try {
        const res = await gasApi('doScanRecord', { payload: decodedText });
        const vf = document.getElementById('viewfinder');

        if (res && res.success) {
          if (res.action === 'recorded' || !res.isDuplicate) {
            vf.classList.add('success');
            triggerFeedback('success');
            showToast(`🟢 ${res.message}`, 'success');
            // 自動切換到剛掃到的那筆作業燈號
            if (res.subject && res.category) {
              currentAssignKey = `${res.subject}_${res.category}`;
            }
            fetchTodayData();
          } else if (res.action === 'duplicate' || res.isDuplicate) {
            vf.classList.add('duplicate');
            triggerFeedback('duplicate');
            showToast(`🟧 ${res.message}`, 'duplicate');
            // 重複掃碼也切換到該作業，讓教師確認
            if (res.subject && res.category) {
              currentAssignKey = `${res.subject}_${res.category}`;
            }
            fetchTodayData();
          } else {
            showToast(`ℹ ${res.message}`, 'success');
          }
        } else {
          triggerFeedback('error');
          showToast(`❌ 登記失敗: ${res ? res.message : ''}`, 'error');
        }

        setTimeout(() => {
          vf.className = 'viewfinder-box';
        }, 1500);

      } catch (err) {
        triggerFeedback('error');
        showToast('❌ 網路請求失敗，請檢查連線', 'error');
      } finally {
        setTimeout(() => { isProcessingScan = false; }, 1200);
      }
    }

    function openMetaModal() {
      if (!currentAssignKey) {
        showToast(' 目前尚無選取的作業可編輯細節', 'error');
        return;
      }
      const curr = (scanDataCache.assignments || []).find(a => a.key === currentAssignKey);
      document.getElementById('modal-unit').value = curr ? (curr.unit || '') : '';
      document.getElementById('modal-note').value = curr ? (curr.note || '') : '';
      document.getElementById('meta-modal').classList.remove('hidden');
    }

    function closeMetaModal() {
      document.getElementById('meta-modal').classList.add('hidden');
    }

    async function saveMetaModal() {
      if (!currentAssignKey) return;
      const curr = (scanDataCache.assignments || []).find(a => a.key === currentAssignKey);
      if (!curr) return;

      const unitVal = document.getElementById('modal-unit').value.trim();
      const noteVal = document.getElementById('modal-note').value.trim();

      showToast('⏳ 正在儲存作業說明...', 'success');
      try {
        const res = await gasApi('updateHomeworkMetadata', {
          colIndex: curr.colIndex,
          unit: unitVal,
          note: noteVal
        });
        if (res && res.success) {
          showToast('🟢 作業說明更新成功！', 'success');
          closeMetaModal();
          fetchTodayData();
        } else {
          showToast('❌ 更新失敗: ' + (res ? res.message : ''), 'error');
        }
      } catch (err) {
        showToast('❌ 系統連線異常', 'error');
      }
    }
  </script>
